# Copy to logpit.toml (or pass --config). Every key is optional; values shown are the defaults.

[storage]
path = "logpit.db"
retention_days = 14          # 0 disables purging
batch_size = 500
flush_interval_ms = 500
queue_capacity = 10000       # entries beyond this are dropped and counted, never buffered unbounded
max_message_bytes = 16384    # longer messages are truncated
max_db_size_mb = 0           # soft cap: beyond it the oldest entries are evicted; 0 = off, else >= 16
# archive_dir = "/var/lib/logpit/archive"   # write entries to daily gzip files before retention removes them

# Per-severity override of retention_days (emerg, alert, crit, err, warn, notice, info, debug
# or 0-7); 0 keeps that severity forever.
# [storage.retention_by_severity]
# debug = 2
# info = 7
# err = 90

[syslog]
# Empty string disables a listener. Use "0.0.0.0:514" to receive from other machines
# (ports below 1024 need root or CAP_NET_BIND_SERVICE).
udp_listen = "127.0.0.1:5514"
tcp_listen = "127.0.0.1:5514"
# timezone = "reception"     # how RFC 3164 stamps (no year, no zone) are read: reception, utc, local, +02:00

[http]
listen = "127.0.0.1:8080"
# token = "change-me"        # protects /ingest and /api/*; set it before exposing the port
max_body_bytes = 8388608
audit_retention_days = 30    # days of access audit kept in the database; 0 = last 1000 in memory only
# Tokens limited to some scopes ("read": search and statistics, "write": ingestion, "admin":
# /api/audit and /api/tokens). A name appears in the audit trail; `hosts` and `apps` limit what a
# read token can see (exact names; empty means all).
# [[http.tokens]]
# token = "shipper-secret"
# scopes = ["write"]
#
# [[http.tokens]]
# token = "web-team-secret"
# name = "web-team"
# scopes = ["read"]
# hosts = ["web1", "web2"]
# apps = ["nginx"]

[silence]
# Alert when a host stops sending logs (webhook + `logpit_host_silent` metric). Off by default.
default_after_secs = 0       # every host, in seconds; 0 = only the hosts listed below
check_interval_secs = 30
webhook_url = ""             # http:// or https://; POST on each alert and recovery
webhook_format = "json"      # json, slack, discord, ntfy or text
# webhook_headers = ["Authorization: Bearer ..."]
# [silence.hosts]
# pve = 120                  # per-host threshold in seconds; 0 = never alert

[ingest]
parse_structured = true      # extract JSON objects and key=value pairs from messages into fields
# Ingestion rules, applied in order before storage (see the README):
# [[ingest.rules]]
# name = "cron-noise"
# action = "drop"            # or "mask"
# app = "cron"
# severity = ["info", "debug"]
#
# [[ingest.rules]]
# name = "secrets"
# action = "mask"
# pattern = '(password|token)=\S+'
# replace = "$1=[hidden]"

# Scheduled backups of the database (a consistent copy, the same as `logpit --backup`).
# [backup]
# dir = "/var/lib/logpit/backups"
# every_hours = 24
# keep = 7

# Forward a filtered copy of the stored entries to another LogPit, a collector or a SIEM.
# [[forward]]
# name = "siem"
# url = "https://siem.example/ingest"       # NDJSON over HTTP(S), or: syslog = "tcp://10.0.0.5:514"
# headers = ["Authorization: Bearer change-me"]
# severity = ["warning", "err"]             # also host, app, pattern

# Volume alerts: notify when a host sends far more or far fewer logs than its usual per window.
# [volume]
# enabled = true
# window_secs = 300
# baseline_windows = 12
# high_factor = 5            # 0 = no surge alerts
# low_factor = 0.2           # 0 = no drop alerts
# min_baseline = 20
# cooldown_secs = 3600

# Host tags: names for sets of hosts (exact names or * and ? patterns), usable as `tag=` filters,
# metric labels and token restrictions.
# [[tags]]
# name = "prod"
# hosts = ["web*", "db1"]

# Regex parsers: named groups become fields (and optionally host, level, timestamp, message).
# [[parsers]]
# name = "nginx"
# app = "nginx"
# regex = '^(?P<remote>\S+) \S+ \S+ \[(?P<time>[^\]]+)\] "(?P<method>[A-Z]+) (?P<path>\S+) [^"]*" (?P<status>\d{3})'
# timestamp_from = "time"
# timestamp_format = "%d/%b/%Y:%H:%M:%S %z"

# Metrics from logs: Prometheus counters on /metrics (logpit_log_<name>_total).
# [[metrics]]
# name = "ssh_failures"
# pattern = "Failed password"
# labels = ["host", "level"]     # host, app, level or a structured field; each combination is a series
# value_field = "bytes"          # optional: also sum a numeric field (logpit_log_<name>_value_sum)
# max_series = 200

# New-pattern alerts: notify through the [silence] webhook when a message template never seen
# before appears (numbers and ids are masked), and optionally when a known one surges.
# [new_patterns]
# enabled = true
# learn_secs = 600               # quiet period after startup; stored templates are learned first
# severity = ["warning", "err"]  # default: warning and above
# ignore = ["healthcheck"]       # regexes for messages to skip
# max_per_minute = 10
# surge_factor = 8               # 0 = no surge detection
# surge_min = 100
# surge_window_secs = 60

# Pattern alerts: notify through the [silence] webhook when matching entries pile up.
# [[alerts]]
# name = "disk-errors"
# pattern = "(?i)disk"
# severity = ["err", "crit"]
# count = 5                  # this many matches ...
# window_secs = 600          # ... within this many seconds
# cooldown_secs = 1800       # quiet period afterwards (default: window_secs)
# per_host = true

# Collapse runs of identical messages into the first one plus a "repeated N more times" summary.
# [ingest.dedup]
# enabled = true
# window_secs = 30
# max_keys = 10000

# Rate limits at ingestion (0 = off). A host may burst, then is held to the sustained rate.
# [ingest.rate_limit]
# per_host_per_sec = 500
# burst = 2000               # default: 4x per_host_per_sec
# global_per_sec = 5000

# GELF listeners (Graylog JSON format; empty = off). POST /gelf on the HTTP port is always available,
# as is the Loki push API at /loki/api/v1/push.
# [gelf]
# udp_listen = "0.0.0.0:12201"
# tcp_listen = "0.0.0.0:12202"
