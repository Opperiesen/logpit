# Copy to logpit.toml (or pass --config). Every key is optional; values shown are the defaults.

[storage]
path = "logpit.db"
retention_days = 14          # 0 disables purging
batch_size = 500
flush_interval_ms = 500
queue_capacity = 10000       # entries beyond this are dropped and counted, never buffered unbounded
max_message_bytes = 16384    # longer messages are truncated

# Per-severity override of retention_days (emerg, alert, crit, err, warn, notice, info, debug
# or 0-7); 0 keeps that severity forever.
# [storage.retention_by_severity]
# debug = 2
# info = 7
# err = 90

[syslog]
# Empty string disables a listener. Use "0.0.0.0:514" to receive from other machines
# (ports below 1024 need root or CAP_NET_BIND_SERVICE).
udp_listen = "127.0.0.1:5514"
tcp_listen = "127.0.0.1:5514"

[http]
listen = "127.0.0.1:8080"
# token = "change-me"        # protects /ingest and /api/*; set it before exposing the port
max_body_bytes = 8388608
# Tokens limited to some scopes ("read": /api/logs and /api/tail, "write": /ingest).
# [[http.tokens]]
# token = "shipper-secret"
# scopes = ["write"]

[silence]
# Alert when a host stops sending logs (webhook + `logpit_host_silent` metric). Off by default.
default_after_secs = 0       # every host, in seconds; 0 = only the hosts listed below
check_interval_secs = 30
webhook_url = ""             # http:// only; JSON POST on each alert and recovery
# [silence.hosts]
# pve = 120                  # per-host threshold in seconds; 0 = never alert
