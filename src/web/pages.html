<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogPit</title>
<style>
/*@theme*/
  @keyframes pulse { 0% { transform:scale(1); opacity:.55; } 70%, 100% { transform:scale(2.6); opacity:0; } }
  @keyframes reveal { from { opacity:0; transform:translateY(-3px); } }
  /* The other views share the search page's world: the same command bar on top, hairline tables below. */
  header.bar { position:sticky; top:0; z-index:10; display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; padding:10px 16px; background:color-mix(in srgb, var(--shell) 88%, transparent); color:var(--shell-ink); backdrop-filter:saturate(1.4) blur(12px); border-bottom:1px solid var(--rule); }
  header.bar a { color:var(--shell-ink); text-decoration:none; }
  header.bar .brand { display:flex; align-items:center; gap:8px; font-size:17px; line-height:32px; font-weight:700; letter-spacing:-.02em; }
  header.bar nav { display:flex; gap:2px; padding:2px; border-radius:var(--radius); background:var(--surface); }
  header.bar nav a { padding:4px 12px; border-radius:var(--radius-s); color:var(--muted); font-size:13px; font-weight:600; transition:background-color .16s var(--ease), color .16s var(--ease); }
  header.bar nav a:hover { background:var(--surface-2); color:var(--ink); }
  header.bar nav a[aria-current=page] { background:var(--surface-2); color:var(--ink); box-shadow:var(--raise); }
  #status { margin-left:auto; color:var(--shell-muted); font-size:12.5px; }
  main { padding:24px 24px 40px; animation:reveal .24s var(--ease); }
  h1 { display:flex; align-items:center; gap:10px; margin:0 0 4px; font-size:24px; font-weight:700; letter-spacing:-.02em; }
  h2 { margin:32px 0 10px; font-size:15px; font-weight:650; letter-spacing:-.01em; }
  .sub { color:var(--muted); margin:0 0 12px; }
  .msg { padding:24px 0; color:var(--muted); }
  a { color:var(--ink); text-decoration-color:var(--field); text-underline-offset:3px; transition:color .16s var(--ease), text-decoration-color .16s var(--ease); }
  a:hover { color:var(--accent); text-decoration-color:currentColor; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:11.5px; font-weight:500; color:var(--muted); padding:6px 12px 6px 0; border-bottom:1px solid var(--rule); white-space:nowrap; }
  td { padding:8px 12px 8px 0; border-bottom:1px solid color-mix(in srgb, var(--rule) 65%, transparent); vertical-align:baseline; }
  tbody tr { transition:background-color .12s var(--ease); }
  tbody tr:hover td { background:var(--tint); }
  td.n, th.n { text-align:right; }
  .mono { font-family:var(--mono); font-size:12.5px; }
  .clip { max-width:0; width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .muted { color:var(--muted); }
  .nw { white-space:nowrap; }
  .e { color:var(--err); font-weight:600; } .w { color:var(--warn); font-weight:600; } .ok { color:var(--ok); font-weight:600; }
  .up, .down { font-weight:600; } td.up, td.down { white-space:nowrap; }
  .up b, .down b { display:inline-block; padding:0 8px; border-radius:999px; font-weight:600; }
  .up b { color:var(--err); background:var(--err-tint); } .down b { color:var(--ok); background:var(--ok-tint); }
  .badge { display:inline-block; padding:0 8px; border-radius:999px; background:var(--err); color:var(--ground); font:600 11px/19px var(--sans); }
  .badge.silent { background:var(--quiet-tint); color:var(--muted); box-shadow:inset 0 0 0 1px var(--field); }
  .tag { display:inline-block; margin-right:4px; padding:0 8px; border-radius:999px; background:var(--quiet-tint); font:500 11px/19px var(--sans); color:var(--muted); }
  .grid { display:grid; gap:0 40px; }
  @media (min-width:1000px) { .grid { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
  form.row { display:flex; flex-wrap:wrap; gap:10px; align-items:end; margin:0 0 14px; padding:14px; border:1px solid var(--rule); border-radius:12px; background:var(--surface); }
  form.row label { display:grid; gap:4px; font-size:12px; color:var(--muted); }
  form.row input, form.row select { background:var(--ground); }
  .s0, .s1, .s2, .s3 { color:var(--err); } .s4 { color:var(--warn); } .s5 { color:var(--notice); } .s6 { color:var(--chart-info); } .s7 { color:var(--chart-debug); }
  .meter { height:5px; border-radius:999px; background:var(--notice); min-width:3px; transition:width .5s var(--ease); }
  /* The host's week as a momentum curve: what is not an error above the line, errors below it. */
  .vol { position:relative; display:flex; gap:2px; height:170px; }
  .vol::before { content:''; position:absolute; left:0; right:0; top:120px; height:1px; background:var(--rule); }
  .vol .col { flex:1 1 0; min-width:0; display:flex; flex-direction:column; border-radius:4px; }
  .vol .col:hover { background:var(--tint); }
  .vol .upz { height:120px; display:flex; flex-direction:column-reverse; }
  .vol .dnz { height:50px; display:flex; flex-direction:column; padding-top:1px; }
  .vol .seg { height:0; background:currentColor; transition:height .4s var(--ease); }
  .vol .upz .seg:last-child { border-radius:4px 4px 0 0; } .vol .dnz .seg:last-child { border-radius:0 0 4px 4px; }
  .ticks { position:relative; height:22px; margin-top:4px; font-size:11px; font-weight:500; color:var(--muted); }
  .ticks span { position:absolute; translate:-50% 0; white-space:nowrap; }
  /* Live state, as on the search page's host rail. */
  .pulse { position:relative; display:inline-block; flex:none; width:10px; height:10px; border-radius:50%; background:var(--field); color:var(--field); }
  .pulse.on { background:var(--ok); color:var(--ok); } .pulse.hot { background:var(--err); color:var(--err); } .pulse.warm { background:var(--warn); color:var(--warn); }
  .pulse.on::after, .pulse.hot::after, .pulse.warm::after { content:''; position:absolute; inset:0; border-radius:50%; background:currentColor; animation:pulse 2.4s var(--ease) infinite; }
  .pulse.off { background:transparent; box-shadow:inset 0 0 0 2px var(--field); }
  .form { display:inline-flex; gap:3px; vertical-align:middle; }
  .form i { width:8px; height:20px; border-radius:2px; background:var(--quiet-tint); }
  .form i.ok { background:color-mix(in srgb, var(--ok) 70%, transparent); } .form i.warn { background:var(--warn); } .form i.err { background:var(--err); }
  .pill { display:inline-flex; align-items:center; gap:8px; padding:2px 12px 2px 10px; border-radius:999px; font-weight:600; }
  .pill.cancelled { background:var(--quiet-tint); color:var(--muted); } .pill.disrupted { background:var(--err-tint); color:var(--err); }
  .pill.delayed { background:var(--warn-tint); color:var(--warn); } .pill.ontime { background:var(--ok-tint); color:var(--ok); }

  /* The board: hosts as a squad, in large type, for a screen left on the wall. */
  .board .head { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:8px; }
  .board .clock { margin-left:auto; font-size:28px; font-weight:700; letter-spacing:-.02em; }
  .board table td { padding:14px 20px 14px 0; font-size:18px; white-space:nowrap; vertical-align:middle; }
  .board td.host { font-size:24px; font-weight:700; letter-spacing:-.02em; }
  .board td.host a { display:inline-flex; align-items:center; gap:12px; color:inherit; text-decoration:none; }
  .board td.host a:hover { color:var(--accent); }
  .board td.latest { font-size:14px; color:var(--muted); }
  .board td.n { font-size:22px; font-weight:650; }
  .board tr { cursor:pointer; }
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="/"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect width="22" height="22" rx="6" fill="currentColor"/><path d="M5 13.5h2.2l1.8-5 2.6 9 2.2-6.5 1.2 2.5H17" fill="none" style="stroke:var(--ground)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>LogPit</a>
  <nav aria-label="Views"><a href="/">Search</a><a href="/board">Board</a><a href="/compare">Compare</a><a href="/admin">Admin</a></nav>
  <span id="status" role="status"></span>
</header>
<main id="view"></main>
<script>
const $ = id => document.getElementById(id);
// A small element builder: h('td', 'n e', '3') or h('a', { href: '/' }, 'text').
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (typeof attrs === 'string') e.className = attrs;
  else if (attrs) for (const [k, v] of Object.entries(attrs)) if (v !== undefined) e.setAttribute(k, v);
  e.append(...kids.filter(k => k !== null && k !== undefined && k !== false));
  return e;
}
const LEVELS = ['emerg', 'alert', 'crit', 'err', 'warn', 'notice', 'info', 'debug'];
let prefs = {};
try { prefs = JSON.parse(localStorage.getItem('logpit-prefs') || '{}'); } catch {}
let token = '';
try { token = localStorage.getItem('logpit-token') || ''; } catch {}
const path = location.pathname.split('/').filter(Boolean);
const view = path[0] || 'board';
// The board is made for a wall screen: dark unless light was chosen; the other views follow the settings.
const theme = view === 'board' ? (prefs.theme === 'light' ? 'light' : 'dark') : prefs.theme;
if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
for (const a of document.querySelectorAll('header nav a')) if (a.getAttribute('href') === '/' + view) a.setAttribute('aria-current', 'page');
// Each view names its tab (the host page names the host).
document.title = ({ board: 'Board', admin: 'Administration', compare: 'Compare' }[view] || 'Board') + ' · LogPit';

function fmtTime(ms) {
  const d = new Date(ms);
  if (prefs.time === 'utc') return d.toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
  if (prefs.time === 'iso') return d.toISOString();
  // Local time reads like the search page: the time alone today, then yesterday, then the day.
  const time = d.toLocaleTimeString([], { hour12: false }), now = new Date();
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const back = Math.round((day(now) - day(d)) / 86400000);
  if (back === 0) return time;
  if (back === 1) return 'yesterday ' + time;
  return d.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short', ...(d.getFullYear() !== now.getFullYear() ? { year: 'numeric' } : {}) }) + ' ' + time;
}
function ago(ms) {
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  return s < 60 ? s + 's ago' : s < 3600 ? Math.floor(s / 60) + 'm ago' : s < 86400 ? Math.floor(s / 3600) + 'h ago' : Math.floor(s / 86400) + 'd ago';
}
class HttpError extends Error { constructor(status, text) { super(text || 'HTTP ' + status); this.status = status; } }
async function api(url, init = {}) {
  const res = await fetch(url, { ...init, headers: { ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(init.headers || {}) } });
  if (!res.ok) throw new HttpError(res.status, (await res.text()).slice(0, 160));
  return res.status === 204 ? null : res.json();
}
const q = obj => new URLSearchParams(Object.entries(obj).filter(([, v]) => v !== '' && v !== undefined && v !== null)).toString();
function say(text) { $('status').textContent = text; }
// One failure message for every view: a missing or weak token points to the main page's Settings.
function failed(e, need) {
  const box = $('view');
  const text = e.status === 401 ? 'This LogPit needs a token. Enter it under Settings on the main page, then come back.'
    : e.status === 403 ? 'This token does not have the ' + need + ' scope this page needs.'
    : 'Could not load: ' + e.message;
  box.replaceChildren(h('p', 'msg', text, ' ', h('a', { href: '/' }, 'Open the main page')));
  say('');
}
const empty = (cols, text) => h('tr', null, h('td', { colspan: String(cols), class: 'muted' }, text));

// The volume from /api/stats as a momentum curve by severity: what is not an error rises above the line,
// errors push below it; day marks under it. Heights are set a frame later, so the bars grow in.
function volume(d) {
  const n = d.buckets.length, low = k => LEVELS.indexOf(k) <= 3;
  let maxUp = 1, maxDn = 1, total = 0;
  for (const b of d.buckets) {
    let up = 0, dn = 0;
    for (const k of LEVELS) { const v = (b.groups || {})[k] || 0; total += v; if (low(k)) dn += v; else up += v; }
    maxUp = Math.max(maxUp, up); maxDn = Math.max(maxDn, dn);
  }
  const box = h('div', { class: 'vol', role: 'img', 'aria-label': total.toLocaleString() + ' entries in ' + n + ' buckets, errors below the line' });
  const segs = [];
  for (const b of d.buckets) {
    const up = h('div', 'upz'), dn = h('div', 'dnz');
    for (const k of LEVELS) {
      const v = (b.groups || {})[k];
      if (!v) continue;
      const seg = h('div', 'seg s' + LEVELS.indexOf(k));
      seg._h = Math.max(2, low(k) ? 48 * v / maxDn : 118 * v / maxUp);
      (low(k) ? dn : up).append(seg);
      segs.push(seg);
    }
    const col = h('div', 'col', up, dn);
    col.title = fmtTime(b.ts) + ' · ' + b.total.toLocaleString() + ' entries' + LEVELS.filter(k => (b.groups || {})[k]).map(k => ', ' + k + ' ' + b.groups[k].toLocaleString()).join('');
    box.append(col);
  }
  requestAnimationFrame(() => requestAnimationFrame(() => segs.forEach(seg => { seg.style.height = seg._h + 'px'; })));
  const ticks = h('div', 'ticks');
  let prev = null;
  d.buckets.forEach((b, i) => {
    const day = new Date(b.ts).toDateString();
    if (prev !== null && day !== prev && i / n < 0.97) {
      const sp = h('span', null, new Date(b.ts).toLocaleDateString([], { weekday: 'short', day: 'numeric' }));
      sp.style.left = (100 * i / n) + '%';
      ticks.append(sp);
    }
    prev = day;
  });
  return [box, ticks];
}

// Live state as on the search page: a dot that pulses while the host talks, and its recent form, a slice
// reading red or amber only when it stands out from the host's own window.
function formWords(form) {
  const tot = form.reduce((a, f) => ({ n: a.n + f.count, e: a.e + f.errors, i: a.i + f.errors + f.warnings }), { n: 0, e: 0, i: 0 });
  const errRate = tot.n ? tot.e / tot.n : 0, issueRate = tot.n ? tot.i / tot.n : 0;
  return form.map(f => {
    if (!f.count) return '';
    if (f.errors >= 2 && f.errors / f.count >= Math.max(2 * errRate, 0.05)) return 'err';
    const issues = f.errors + f.warnings;
    if (issues >= 2 && issues / f.count >= Math.max(2 * issueRate, 0.1)) return 'warn';
    return 'ok';
  });
}
function formEl(form) {
  const box = h('span', { class: 'form', role: 'img' });
  if (!form) return box;
  const words = formWords(form), said = { err: 0, warn: 0, ok: 0, '': 0 };
  form.forEach((f, k) => {
    said[words[k]]++;
    box.append(h('i', { class: words[k], title: f.count.toLocaleString() + ' entries' + (f.errors ? ', ' + f.errors.toLocaleString() + ' errors' : '') + (f.warnings ? ', ' + f.warnings.toLocaleString() + ' warnings' : '') }));
  });
  box.setAttribute('aria-label', 'Recent form, oldest first: ' + [[said.err, 'with more errors than usual'], [said.warn, 'with more warnings than usual'], [said.ok, 'as usual'], [said[''], 'quiet']].filter(([n]) => n).map(([n, t]) => n + ' ' + t).join(', '));
  return box;
}
// A number rolls from what it showed to its new value.
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)');
function roll(el, to, from) {
  const start = from === undefined ? to : from;
  el.dataset.n = String(to);
  if (start === to || document.hidden || REDUCED.matches) { el.textContent = to.toLocaleString(); return el; }
  el.textContent = start.toLocaleString();
  const t0 = performance.now();
  const step = now => {
    if (el.dataset.n !== String(to)) return;
    const k = Math.min(1, (now - t0) / 700), e = 1 - Math.pow(1 - k, 4);
    el.textContent = Math.round(start + (to - start) * e).toLocaleString();
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  return el;
}

// ---------- Board ----------
const STATES = { cancelled: ['Silent', 0], disrupted: ['Failing', 1], delayed: ['Degraded', 2], ontime: ['Healthy', 3] };
async function board() {
  const win = Number(new URLSearchParams(location.search).get('minutes')) || 15;
  const clock = h('span', 'clock');
  const tick = () => { clock.textContent = new Date().toLocaleTimeString([], { hour12: false }); };
  tick(); setInterval(tick, 1000);
  const body = h('tbody');
  $('view').replaceChildren(h('div', 'board',
    h('div', 'head', h('h1', null, 'Hosts'), h('span', 'sub', 'errors and warnings over the last ' + win + ' minutes'), clock),
    h('table', null,
      h('thead', null, h('tr', null, h('th', null, 'Host'), h('th', null, 'Status'), h('th', { title: 'The window in five slices, oldest first' }, 'Form'), h('th', null, 'Last log'), h('th', 'n', 'Errors'), h('th', 'n', 'Warnings'), h('th', null, 'Latest'))),
      body)));
  let shown = new Map(); // the figures of the last refresh, so they roll to the new ones
  async function refresh() {
    if (document.hidden) return;
    try {
      const now = Date.now();
      // Every known host (a week back, so silent ones are listed), then what each did in the window.
      const [known, recent] = await Promise.all([
        api('/api/hosts?' + q({ since: now - 7 * 86400000, limit: 200, sort: 'host', order: 'asc' })),
        api('/api/hosts?' + q({ since: now - win * 60000, limit: 200, sort: 'errors', order: 'desc', form: 5 })),
      ]);
      const inWin = Object.fromEntries(recent.map(r => [r.host, r]));
      const rows = known.map(k => {
        const r = inWin[k.host] || { errors: 0, warnings: 0 };
        const state = k.silent ? 'cancelled' : r.errors ? 'disrupted' : r.warnings ? 'delayed' : 'ontime';
        return { host: k.host, state, errors: r.errors, warnings: r.warnings, last: k.last_ts, form: r.form, silent: k.silent };
      }).sort((a, b) => STATES[a.state][1] - STATES[b.state][1] || b.errors - a.errors || a.host.localeCompare(b.host));
      // The latest error or warning of the hosts in trouble (a few requests, not one per host).
      const troubled = rows.filter(r => r.state === 'disrupted' || r.state === 'delayed').slice(0, 20);
      const latest = Object.fromEntries(await Promise.all(troubled.map(async r => {
        try {
          const l = await api('/api/logs?' + q({ host: r.host, level: r.state === 'disrupted' ? 3 : 4, since: now - win * 60000, limit: 1 }));
          return [r.host, l[0] ? l[0].message : ''];
        } catch { return [r.host, '']; }
      })));
      const focused = document.activeElement && document.activeElement.closest('td.host') ? document.activeElement.textContent : null;
      body.replaceChildren(...(rows.length ? rows.map(r => {
        const [label] = STATES[r.state];
        const talking = Date.now() - r.last < 120000;
        const dot = h('span', { class: 'pulse ' + (r.silent ? 'off' : !talking ? '' : r.state === 'disrupted' ? 'hot' : r.state === 'delayed' ? 'warm' : 'on'), 'aria-hidden': 'true' });
        const was = shown.get(r.host) || {};
        const tr = h('tr', null,
          h('td', 'host', h('a', { href: '/host/' + encodeURIComponent(r.host) }, dot, r.host)),
          h('td', 'state', h('span', 'pill ' + r.state, label)),
          h('td', null, formEl(r.form)),
          h('td', 'muted', ago(r.last)),
          roll(h('td', 'n' + (r.errors ? ' e' : ' muted')), r.errors, was.errors),
          roll(h('td', 'n' + (r.warnings ? ' w' : ' muted')), r.warnings, was.warnings),
          h('td', 'latest mono clip', latest[r.host] || ''));
        tr.onclick = () => { location.href = '/host/' + encodeURIComponent(r.host); };
        return tr;
      }) : [empty(7, 'No host has sent logs in the last week.')]));
      shown = new Map(rows.map(r => [r.host, { errors: r.errors, warnings: r.warnings }]));
      if (focused) for (const a of body.querySelectorAll('td.host a')) if (a.textContent === focused) a.focus();
      say('updated ' + new Date().toLocaleTimeString([], { hour12: false }));
    } catch (e) { failed(e, 'read'); }
  }
  await refresh();
  setInterval(refresh, 30000);
}

// ---------- Host page ----------
async function hostPage() {
  const name = decodeURIComponent(path[1] || '');
  document.title = name + ' · LogPit';
  say('loading…');
  try {
    const now = Date.now(), week = now - 7 * 86400000, day = now - 86400000;
    const [hosts, stats, errors, apps, pats, alerts] = await Promise.all([
      api('/api/hosts?' + q({ since: week, limit: 200 })),
      api('/api/stats?' + q({ host: name, since: week, group_by: 'severity' })),
      api('/api/logs?' + q({ host: name, level: 3, since: week, limit: 15 })),
      api('/api/top?' + q({ host: name, field: 'app', since: day, limit: 10 })),
      api('/api/patterns?' + q({ host: name, since: day, limit: 10 })),
      api('/api/alerts?' + q({ host: name, limit: 20 })).catch(() => []),
    ]);
    const me = hosts.find(x => x.host === name);
    const head = h('div', null,
      h('h1', null, h('span', { class: 'pulse ' + (!me ? 'off' : me.silent ? 'off' : Date.now() - me.last_ts < 120000 ? 'on' : ''), 'aria-hidden': 'true' }), name, me && me.silent ? h('span', 'badge silent', 'silent') : null),
      h('p', 'sub', me ? 'Last log ' + ago(me.last_ts) + ' · ' + me.count.toLocaleString() + ' entries this week, ' + me.errors.toLocaleString() + ' errors, ' + me.warnings.toLocaleString() + ' warnings · ' : 'No logs this week · ',
        ...(me && me.tags || []).map(t => h('span', 'tag', t)), ' ', h('a', { href: '/?' + q({ host: name, range: 604800000 }) }, 'Search its logs')));
    const errRows = errors.length ? errors.map(r => h('tr', null, h('td', 'muted nw', fmtTime(r.ts)), h('td', 'muted nw', r.app), h('td', 'mono clip', r.message))) : [empty(3, 'No errors this week.')];
    const maxApp = Math.max(1, ...apps.values.map(v => v.count));
    const appRows = apps.values.length ? apps.values.map(v => h('tr', null, h('td', 'mono', v.value), h('td', { style: 'width:50%' }, Object.assign(h('div', 'meter'), { style: 'width:' + (100 * v.count / maxApp) + '%' })), h('td', 'n', v.count.toLocaleString()))) : [empty(3, 'No logs in the last 24 hours.')];

// Editing a rule in place: its name, how many lines within how many minutes, per host or overall; the
// pattern and the other conditions are kept. A new name saves the rule under it and deletes the old one.
function editRule(tr, r) {
  const num = (name, value, label) => h('input', { name, type: 'number', min: '1', value: String(value), required: '', 'aria-label': label, style: 'width:6em' });
  const form = h('form', 'row',
    h('label', null, 'Name', h('input', { name: 'name', value: r.name, required: '', maxlength: '80', size: '28' })),
    h('label', null, 'Lines', num('count', r.count, 'Number of matching lines')),
    h('label', null, 'Within (minutes)', num('mins', Math.max(1, Math.round(r.window_secs / 60)), 'Window in minutes')),
    h('label', null, 'Quiet after (minutes)', h('input', { name: 'cool', type: 'number', min: '1', value: r.cooldown_secs ? String(Math.round(r.cooldown_secs / 60)) : '', placeholder: 'the window', 'aria-label': 'Quiet period in minutes', style: 'width:7em' })),
    h('label', { style: 'display:flex;gap:6px;align-items:center' }, h('input', { name: 'per', type: 'checkbox', ...(r.per_host ? { checked: '' } : {}) }), 'per host'),
    h('button', { class: 'primary' }, 'Save'),
    Object.assign(h('button', { type: 'button' }, 'Cancel'), { onclick: () => admin() }));
  form.onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(form), name = String(f.get('name')).trim(), cool = Number(f.get('cool'));
    const { id, created_ts, ...rule } = r;
    Object.assign(rule, { name, count: Number(f.get('count')), window_secs: 60 * Number(f.get('mins')), per_host: f.get('per') === 'on', cooldown_secs: cool ? 60 * cool : null });
    try {
      await api('/api/alert-rules', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(rule) });
      if (name !== r.name) await api('/api/alert-rules/' + id, { method: 'DELETE' });
      await admin();
      say('alert rule "' + name + '" saved');
    } catch (err) { say('could not save the alert rule: ' + err.message); }
  };
  const cell = h('td', { colspan: '5' }, form);
  tr.replaceChildren(cell);
  form.querySelector('input').focus();
}
// The database: its size, entries and span, where its size is heading at the last day's pace (with the
// retention and the size cap), and each host's share of the entries.
const mb = bytes => (bytes / 1e6).toLocaleString([], { maximumFractionDigits: bytes < 1e7 ? 1 : 0 }) + ' MB';
function storageSection(s, hosts) {
  if (!s) return [];
  // The pace is the last day's entries, or, on a younger database, its entries over the time it covers.
  const covered = s.oldest_ts ? Math.min(86400000, Date.now() - s.oldest_ts) : 0;
  const cap = s.max_db_size_mb * 1e6, perEntry = s.entries ? s.used_bytes / s.entries : 0;
  const perDay = covered >= 3600000 ? perEntry * s.entries_last_day * 86400000 / covered : 0;
  const figures = h('table', null,
    h('thead', null, h('tr', null, h('th', null, 'Size'), h('th', 'n', 'Entries'), h('th', null, 'Oldest entry'), h('th', 'n', 'Last 24 hours'), h('th', null, 'Kept'))),
    h('tbody', null, h('tr', null,
      h('td', null, mb(s.used_bytes), cap ? h('span', 'muted', ' of ' + mb(cap)) : null),
      h('td', 'n', s.entries.toLocaleString()),
      h('td', 'muted', s.oldest_ts ? fmtTime(s.oldest_ts) + ' (' + ago(s.oldest_ts).replace(' ago', '') + ')' : '—'),
      h('td', 'n', '+' + s.entries_last_day.toLocaleString(), perDay ? h('span', 'muted', ' · ≈ ' + mb(perDay) + '/day') : null),
      h('td', 'muted', (s.retention_days ? s.retention_days + ' days' : 'forever') + (cap ? ', at most ' + mb(cap) : '')))));
  let outlook = 'Not enough recent entries to tell where the size is heading.';
  if (perDay > 0) {
    const settle = s.retention_days ? perDay * s.retention_days : Infinity;
    if (cap && settle > cap) {
      const days = Math.max(0, (cap - s.used_bytes) / perDay);
      outlook = s.used_bytes >= cap * 0.9 ? 'At the size cap: the oldest entries are dropped to stay under ' + mb(cap) + '.'
        : 'At this pace the ' + mb(cap) + ' cap is reached in about ' + (days < 1 ? 'a day' : Math.round(days) + ' days') + '; the oldest entries are then dropped to stay under it.';
    } else if (Number.isFinite(settle)) outlook = 'At this pace the database settles around ' + mb(settle) + ', with ' + s.retention_days + ' days kept.';
    else outlook = 'Nothing is purged by age: at this pace the database grows by about ' + mb(perDay * 30) + ' a month.';
  }
  const total = Math.max(1, hosts.reduce((a, x) => a + x.count, 0)), top = hosts.slice(0, 8);
  const shareRows = top.map(x => h('tr', null,
    h('td', null, h('a', { href: '/host/' + encodeURIComponent(x.host) }, x.host)),
    h('td', { style: 'width:50%' }, Object.assign(h('div', 'meter'), { style: 'width:' + (100 * x.count / total) + '%' })),
    h('td', 'n', x.count.toLocaleString()), h('td', 'n muted', (100 * x.count / total).toFixed(1) + '%')));
  if (hosts.length > top.length) {
    const rest = hosts.slice(top.length).reduce((a, x) => a + x.count, 0);
    shareRows.push(h('tr', null, h('td', 'muted', (hosts.length - top.length) + ' other hosts'), h('td', null), h('td', 'n muted', rest.toLocaleString()), h('td', 'n muted', (100 * rest / total).toFixed(1) + '%')));
  }
  return [h('h2', null, 'Storage'), figures, h('p', 'sub', outlook),
    h('table', null, h('thead', null, h('tr', null, h('th', null, 'Host'), h('th', null, 'Share of the entries'), h('th', 'n', 'Entries'), h('th', 'n', ''))), h('tbody', null, ...shareRows))];
}
async function muteRule(rule, minutes) {
  try { await api('/api/mutes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rule, minutes }) }); await admin(); say(minutes ? '"' + rule + '" muted for ' + minutes + ' minutes' : '"' + rule + '" unmuted'); }
  catch (e) { say('could not change the mute: ' + e.message); }
}
async function deleteRule(id) {
  try { await api('/api/alert-rules/' + id, { method: 'DELETE' }); admin(); } catch (e) { say('could not delete the alert rule: ' + e.message); }
}
async function endWindow(id) {
  try { await api('/api/maintenance/' + id, { method: 'DELETE' }); admin(); } catch (e) { say('could not end the window: ' + e.message); }
}

// ---------- Compare two windows ----------
const toInput = ms => new Date(ms - new Date(ms).getTimezoneOffset() * 60000).toISOString().slice(0, 16);
async function compare() {
  const p = new URLSearchParams(location.search), now = Date.now(), hour = 3600000;
  const num = (k, d) => Number(p.get(k)) || d;
  const w = { a0: num('a_since', now - 2 * hour), a1: num('a_until', now - hour), b0: num('b_since', now - hour), b1: num('b_until', now) };
  const field = (name, label, value, type = 'datetime-local') => h('label', null, label, h('input', { name, type, value, size: '14' }));
  const form = h('form', 'row',
    field('a0', 'Before, from', toInput(w.a0)), field('a1', 'to', toInput(w.a1)),
    field('b0', 'After, from', toInput(w.b0)), field('b1', 'to', toInput(w.b1)),
    field('host', 'Host', p.get('host') || '', 'text'), field('app', 'App', p.get('app') || '', 'text'), field('q', 'Search', p.get('q') || '', 'text'),
    h('button', { class: 'primary' }, 'Compare'));
  const out = h('div');
  $('view').replaceChildren(h('h1', null, 'Compare two windows'), h('p', 'sub', 'What changed between a window before and a window after, such as around an upgrade.'), form, out);
  form.onsubmit = e => {
    e.preventDefault();
    const f = new FormData(form), t = k => new Date(String(f.get(k))).getTime();
    history.replaceState(null, '', '/compare?' + q({ a_since: t('a0'), a_until: t('a1'), b_since: t('b0'), b_until: t('b1'), host: f.get('host'), app: f.get('app'), q: f.get('q') }));
    compare();
  };
  if (!(w.a0 < w.a1 && w.b0 < w.b1)) { out.replaceChildren(h('p', 'msg', 'Each window needs its start before its end.')); return; }
  say('comparing…');
  try {
    const filters = { host: p.get('host') || '', app: p.get('app') || '', q: p.get('q') || '' };
    const get = (url, a, b, extra) => api(url + '?' + q({ ...filters, since: a, until: b, ...extra }));
    const [ha, hb, pa, pb] = await Promise.all([
      get('/api/hosts', w.a0, w.a1, { limit: 200 }), get('/api/hosts', w.b0, w.b1, { limit: 200 }),
      get('/api/patterns', w.a0, w.a1, { limit: 50 }), get('/api/patterns', w.b0, w.b1, { limit: 50 }),
    ]);
    const sum = (rows, k) => rows.reduce((s, r) => s + r[k], 0);
    const delta = (a, b) => {
      if (a === b) return h('td', 'n muted', '=');
      const pct = a ? Math.round(100 * (b - a) / a) : null;
      return h('td', 'n ' + (b > a ? 'up' : 'down'), h('b', null, (b > a ? '+' : '−') + Math.abs(b - a).toLocaleString() + (pct !== null ? ' (' + (pct > 0 ? '+' : '') + pct + '%)' : '')));
    };
    const totals = h('table', null,
      h('thead', null, h('tr', null, h('th', null, ''), h('th', 'n', 'Before'), h('th', 'n', 'After'), h('th', 'n', 'Change'))),
      h('tbody', null, ...[['Entries', 'count'], ['Errors', 'errors'], ['Warnings', 'warnings']].map(([label, k]) => {
        const a = sum(ha, k), b = sum(hb, k);
        return h('tr', null, h('td', null, label), h('td', 'n', a.toLocaleString()), h('td', 'n', b.toLocaleString()), delta(a, b));
      })));
    const byHost = {};
    for (const r of ha) byHost[r.host] = { a: r, b: null };
    for (const r of hb) (byHost[r.host] = byHost[r.host] || { a: null }).b = r;
    const hostRows = Object.entries(byHost).map(([host, { a, b }]) => ({ host, a: a ? a.count : 0, b: b ? b.count : 0, ea: a ? a.errors : 0, eb: b ? b.errors : 0 }))
      .sort((x, y) => Math.abs(y.eb - y.ea) - Math.abs(x.eb - x.ea) || Math.abs(y.b - y.a) - Math.abs(x.b - x.a));
    const hostTable = h('table', null,
      h('thead', null, h('tr', null, h('th', null, 'Host'), h('th', 'n', 'Entries before'), h('th', 'n', 'after'), h('th', 'n', 'Change'), h('th', 'n', 'Errors before'), h('th', 'n', 'after'), h('th', 'n', 'Change'))),
      h('tbody', null, ...(hostRows.length ? hostRows.map(r => h('tr', null, h('td', null, h('a', { href: '/host/' + encodeURIComponent(r.host) }, r.host)),
        h('td', 'n', r.a.toLocaleString()), h('td', 'n', r.b.toLocaleString()), delta(r.a, r.b), h('td', 'n', r.ea.toLocaleString()), h('td', 'n', r.eb.toLocaleString()), delta(r.ea, r.eb))) : [empty(7, 'No entries in either window.')])));
    // Patterns: new after, gone after, and those that at least doubled (with five more at least).
    const A = Object.fromEntries(pa.patterns.map(x => [x.pattern, x.count])), B = Object.fromEntries(pb.patterns.map(x => [x.pattern, x.count]));
    const appeared = pb.patterns.filter(x => !(x.pattern in A)), gone = pa.patterns.filter(x => !(x.pattern in B));
    const grew = pb.patterns.filter(x => x.pattern in A && x.count >= 2 * A[x.pattern] && x.count - A[x.pattern] >= 5);
    const patTable = (rows, count, none) => h('table', null, h('tbody', null, ...(rows.length ? rows.map(x => h('tr', null, h('td', 'n', count(x)), h('td', 'mono clip', x.pattern || '(empty)'))) : [empty(2, none)])));
    out.replaceChildren(
      h('h2', null, 'Totals'), totals,
      h('h2', null, 'Hosts'), hostTable,
      h('div', 'grid',
        h('section', null, h('h2', null, 'Patterns that appeared'), patTable(appeared, x => x.count.toLocaleString(), 'None.')),
        h('section', null, h('h2', null, 'Patterns that went away'), patTable(gone, x => x.count.toLocaleString(), 'None.')),
        h('section', null, h('h2', null, 'Patterns that at least doubled'), patTable(grew, x => A[x.pattern].toLocaleString() + ' → ' + x.count.toLocaleString(), 'None.'))));
    say('');
  } catch (e) { failed(e, 'read'); }
}
