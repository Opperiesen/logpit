<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogPit</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1b1f24; --muted:#6a737d; --line:#d8dee4; --accent:#0969da; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#58a6ff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line); align-items:center; position:sticky; top:0; background:var(--bg); }
  h1 { font-size:16px; margin:0 8px 0 0; }
  input, select, button { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  input[type=search] { flex:1 1 240px; min-width:160px; }
  button { cursor:pointer; background:var(--accent); color:#fff; border-color:var(--accent); }
  label { color:var(--muted); display:flex; align-items:center; gap:4px; }
  #status { color:var(--muted); margin-left:auto; }
  table { width:100%; border-collapse:collapse; font:12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  td { padding:3px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  td.ts, td.host, td.app { white-space:nowrap; color:var(--muted); }
  td.msg { white-space:pre-wrap; word-break:break-word; width:100%; }
  .sev { font-weight:600; }
  .fields { margin-top:2px; display:flex; flex-wrap:wrap; gap:2px 8px; color:var(--muted); font-size:11.5px; }
  .fields span { cursor:pointer; } .fields span:hover { color:var(--accent); }
  .fields b { font-weight:600; }
  .s0,.s1,.s2,.s3 { color:#d1242f; } .s4 { color:#bf8700; } .s5 { color:#0969da; } .s6 { color:var(--muted); } .s7 { color:var(--muted); opacity:.7; }
  :root { --c0:#4e79a7; --c1:#f28e2b; --c2:#59a14f; --c3:#b07aa1; --c4:#76b7b2; --c5:#edc948; --c6:#ff9da7; --c7:#9c755f; --c8:#af7aa1; --c9:#86bc86; --other:#8b949e; }
  #chartbar { display:flex; flex-wrap:wrap; align-items:center; gap:4px 14px; padding:6px 16px; font-size:12px; color:var(--muted); }
  #chartbar select { padding:2px 6px; font-size:12px; }
  #legend { display:flex; flex-wrap:wrap; gap:2px 12px; }
  .lg { display:inline-flex; align-items:center; gap:5px; }
  .lg[data-key] { cursor:pointer; } .lg[data-key]:hover { color:var(--accent); }
  .lg i { width:10px; height:10px; border-radius:2px; background:currentColor; display:inline-block; }
  .lg b { font-weight:600; color:var(--fg); }
  #chart { display:block; width:100%; height:64px; border-bottom:1px solid var(--line); }
  #chart rect { fill:currentColor; }
  #chart .hit { fill:transparent; cursor:zoom-in; } #chart .hit:hover { fill:var(--accent); fill-opacity:.15; }
  #chart .hit.flat { cursor:default; }
  #hosts { border-bottom:1px solid var(--line); padding:0 16px; font-size:12px; }
  #hosts summary { cursor:pointer; padding:6px 0; color:var(--muted); }
  #hostsTable { width:auto; min-width:min(100%, 520px); margin:0 0 8px; }
  #hostsTable th { text-align:left; font-weight:600; color:var(--muted); padding:2px 14px 2px 0; border-bottom:1px solid var(--line); }
  #hostsTable th[data-sort] { cursor:pointer; user-select:none; } #hostsTable th[data-sort]:hover { color:var(--accent); }
  #hostsTable th[aria-sort]::after { content:' \25B2'; font-size:9px; } #hostsTable th[aria-sort=descending]::after { content:' \25BC'; }
  #hostsTable th.n, #hostsTable td.n { text-align:right; }
  #hostsTable td { padding:2px 14px 2px 0; border-bottom:1px solid var(--line); white-space:nowrap; }
  #hostsTable td.name { cursor:pointer; } #hostsTable td.name:hover { color:var(--accent); }
  #hostsTable tr.active td.name { font-weight:700; }
  #hostsTable td.zero { color:var(--muted); opacity:.6; }
  .badge { background:#d1242f; color:#fff; border-radius:4px; padding:0 5px; margin-left:6px; font:600 11px system-ui, sans-serif; }
  #empty { padding:24px 16px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>LogPit</h1>
  <input id="q" type="search" placeholder="Search messages…" autofocus>
  <input id="host" type="search" placeholder="Host" size="12">
  <input id="app" type="search" placeholder="App" size="12">
  <input id="f" type="search" placeholder="field:value" size="14" title="Filter on a structured field, e.g. act:blocked">
  <select id="level" title="Minimum severity">
    <option value="">All levels</option>
    <option value="3">Error and above</option>
    <option value="4">Warning and above</option>
    <option value="6">Info and above</option>
  </select>
  <select id="range" title="Time range">
    <option value="900000">Last 15 min</option>
    <option value="3600000" selected>Last hour</option>
    <option value="86400000">Last 24 h</option>
    <option value="604800000">Last 7 days</option>
    <option value="">All time</option>
  </select>
  <input id="token" type="password" placeholder="Token (if set)" size="12" autocomplete="off">
  <label title="Stream new entries as they arrive"><input id="live" type="checkbox"> Live</label>
  <button id="go">Search</button>
  <span id="status"></span>
</header>
<div id="chartbar" hidden>
  <label>Stack by
    <select id="group"><option value="severity">severity</option><option value="host">host</option><option value="app">app</option></select>
  </label>
  <div id="legend"></div>
</div>
<svg id="chart" viewBox="0 0 1 1" preserveAspectRatio="none" hidden></svg>
<details id="hosts">
  <summary>Hosts <span id="hostsCount"></span></summary>
  <table id="hostsTable">
    <thead><tr><th data-sort="host">Host</th><th class="n" data-sort="count">Entries</th><th class="n" data-sort="errors">Errors</th><th class="n" data-sort="warnings">Warnings</th><th data-sort="last_ts">Last seen</th></tr></thead>
    <tbody id="hostsBody"></tbody>
  </table>
</details>
<table><tbody id="rows"></tbody></table>
<div id="empty" hidden></div>
<script>
const $ = id => document.getElementById(id);
const LEVELS = ['emerg','alert','crit','err','warn','notice','info','debug'];
try { $('token').value = localStorage.getItem('logpit-token') || ''; } catch {}

function td(cls, text) { const c = document.createElement('td'); c.className = cls; c.textContent = text; return c; }

// Message cell: the message plus its structured fields (click a field to filter on it).
function msgCell(r) {
  const c = td('msg', r.message);
  const keys = Object.keys(r.fields || {}).filter(k => !k.startsWith('cef_') && k !== 'msg');
  if (keys.length) {
    const box = document.createElement('div');
    box.className = 'fields';
    for (const k of keys) {
      const s = document.createElement('span');
      const b = document.createElement('b');
      b.textContent = k + '=';
      s.append(b, document.createTextNode(r.fields[k]));
      s.title = 'Filter on ' + k + ':' + r.fields[k];
      s.onclick = () => { $('f').value = k + ':' + r.fields[k]; load(); };
      box.append(s);
    }
    c.append(box);
  }
  return c;
}

function rowEl(r) {
  const tr = document.createElement('tr');
  tr.append(
    td('ts', new Date(r.ts).toLocaleString()),
    td('sev s' + r.severity, LEVELS[r.severity] || r.severity),
    td('host', r.host), td('app', r.app), msgCell(r));
  return tr;
}

function authHeaders() {
  const token = $('token').value;
  return token ? { Authorization: 'Bearer ' + token } : {};
}

// Live tail: SSE over fetch (EventSource cannot send the Authorization header).
let tailCtl = null;
const MAX_LIVE_ROWS = 1000;

let chartTimer = null, chartBusy = false;
const CHART_REFRESH_MS = 5000;

function stopTail() {
  if (tailCtl) tailCtl.abort();
  tailCtl = null;
  clearInterval(chartTimer);
  chartTimer = null;
}

// While live, redraw the histogram periodically so it follows the stream.
async function refreshChart() {
  if (document.hidden || chartBusy) return;
  chartBusy = true;
  try { await Promise.all([loadChart(), loadHosts()]); } finally { chartBusy = false; }
}

function handleEvent(raw) {
  let name = 'message', data = '';
  for (const line of raw.split('\n')) {
    if (line.startsWith('event:')) name = line.slice(6).trim();
    else if (line.startsWith('data:')) data += line.slice(5).trimStart();
  }
  if (name === 'lagged') { $('status').textContent = 'live: skipped ' + data + ' entries'; return; }
  if (!data) return;
  const body = $('rows');
  body.prepend(rowEl(JSON.parse(data)));
  while (body.rows.length > MAX_LIVE_ROWS) body.deleteRow(-1);
  $('empty').hidden = true;
  $('status').textContent = 'live · ' + body.rows.length + ' entries';
}

async function startTail() {
  stopTail();
  const ctl = tailCtl = new AbortController();
  chartTimer = setInterval(refreshChart, CHART_REFRESH_MS);
  const p = new URLSearchParams();
  for (const k of SNAP_KEYS) if (snap[k]) p.set(k, snap[k]);
  while (tailCtl === ctl) {
    try {
      const res = await fetch('/api/tail?' + p, { headers: authHeaders(), signal: ctl.signal });
      if (!res.ok) throw new Error((await res.text()).slice(0, 120) || 'HTTP ' + res.status);
      $('status').textContent = 'live';
      const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
      let buf = '';
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += value.replace(/\r\n/g, '\n');
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) { handleEvent(buf.slice(0, i)); buf = buf.slice(i + 2); }
      }
    } catch (e) {
      if (ctl.signal.aborted) return;
      $('status').textContent = 'live: ' + String(e.message || e) + ' (retrying)';
    }
    if (tailCtl !== ctl) return;
    await new Promise(r => setTimeout(r, 3000));
  }
}

// Histogram of the current filters, stacked by severity (errors at the bottom), host or app.
// Clicking a host or app in the legend filters on it.
// Filters of the last search, so the chart keeps matching the table even if the inputs are
// edited without searching. The time window slides with the clock (used by live refresh).
let snap = null;
const SNAP_KEYS = ['q', 'host', 'app', 'level', 'f'];
function takeSnapshot() {
  snap = { range: $('range').value };
  if (snap.range === 'custom' && zoomWindow) Object.assign(snap, zoomWindow);
  for (const k of SNAP_KEYS) snap[k] = $(k).value.trim();
}
// A relative range slides with the clock; a zoomed window is fixed.
function applyWindow(p, s) {
  if (s.range === 'custom') { p.set('since', String(s.since)); p.set('until', String(s.until)); }
  else if (s.range) p.set('since', String(Date.now() - Number(s.range)));
}
function chartParams() {
  const p = new URLSearchParams();
  for (const k of SNAP_KEYS) if (snap[k]) p.set(k, snap[k]);
  applyWindow(p, snap);
  return p;
}

// Clicking a histogram bar zooms to that bucket: it becomes a fixed window, offered as an extra
// entry in the range selector (choose another range to leave it). Live is switched off.
let zoomWindow = null;
const MIN_ZOOM_MS = 10000;
function zoomTo(since, until) {
  zoomWindow = { since, until };
  let opt = $('range-custom');
  if (!opt) { opt = document.createElement('option'); opt.id = 'range-custom'; opt.value = 'custom'; $('range').append(opt); }
  opt.textContent = new Date(since).toLocaleString() + ' → ' + new Date(until).toLocaleString();
  $('range').value = 'custom';
  $('live').checked = false;
  load();
}
function leaveZoom() {
  zoomWindow = null;
  const opt = $('range-custom');
  if (opt) opt.remove();
}
try { $('group').value = localStorage.getItem('logpit-group') || 'severity'; } catch {}

function colorFor(group, key, i) {
  if (group === 'severity') return null; // styled through the s0..s7 classes
  return key === 'other' ? 'var(--other)' : 'var(--c' + (i % 10) + ')';
}

async function loadChart() {
  if (!snap) return;
  const chart = $('chart'), bar = $('chartbar'), group = $('group').value;
  const p = chartParams();
  p.set('group_by', group);
  const hide = () => { chart.hidden = true; bar.hidden = true; };
  try {
    const res = await fetch('/api/stats?' + p, { headers: authHeaders() });
    if (!res.ok) { hide(); return; }
    const d = await res.json();
    // Stacking order: severities from most to least severe, otherwise largest group first.
    const keys = group === 'severity' ? LEVELS.filter(k => d.keys.includes(k)) : d.keys;
    const totals = Object.fromEntries(keys.map(k => [k, 0]));
    const max = Math.max(1, ...d.buckets.map(b => b.total));
    const NS = 'http://www.w3.org/2000/svg';
    const style = (el, k, i) => {
      if (group === 'severity') el.setAttribute('class', 's' + LEVELS.indexOf(k));
      else el.style.color = colorFor(group, k, i);
    };
    const bars = [], hits = [];
    d.buckets.forEach((b, i) => {
      let y = 100;
      const parts = [];
      keys.forEach((k, ki) => {
        const n = (b.groups || {})[k];
        if (!n) return;
        totals[k] += n;
        const h = 100 * n / max;
        y -= h;
        const r = document.createElementNS(NS, 'rect');
        style(r, k, ki);
        r.setAttribute('x', i + 0.1); r.setAttribute('width', 0.8);
        r.setAttribute('y', y); r.setAttribute('height', h);
        bars.push(r);
        parts.push((k || '(none)') + ' ' + n);
      });
      const hit = document.createElementNS(NS, 'rect');
      hit.setAttribute('class', 'hit');
      hit.setAttribute('x', i); hit.setAttribute('width', 1);
      hit.setAttribute('y', 0); hit.setAttribute('height', 100);
      const zoomable = d.bucket_ms > MIN_ZOOM_MS;
      if (zoomable) hit.onclick = () => zoomTo(b.ts, b.ts + d.bucket_ms - 1);
      else hit.classList.add('flat');
      const t = document.createElementNS(NS, 'title');
      t.textContent = new Date(b.ts).toLocaleString() + ' — ' + b.total +
        (parts.length ? ' (' + parts.join(', ') + ')' : '') + (zoomable ? ' · click to zoom' : '');
      hit.append(t);
      hits.push(hit);
    });
    chart.setAttribute('viewBox', '0 0 ' + Math.max(1, d.buckets.length) + ' 100');
    chart.replaceChildren(...bars, ...hits);
    chart.hidden = false;

    const items = keys.map((k, ki) => {
      const el = document.createElement('span');
      el.className = 'lg';
      const sw = document.createElement('i');
      style(sw, k, ki);
      const name = document.createElement('span');
      name.textContent = k || '(none)';
      const n = document.createElement('b');
      n.textContent = totals[k].toLocaleString();
      el.append(sw, name, n);
      if ((group === 'host' || group === 'app') && k && k !== 'other') {
        el.dataset.key = k;
        el.title = 'Filter on ' + group + ' ' + k;
        el.onclick = () => { $(group).value = k; load(); };
      }
      return el;
    });
    $('legend').replaceChildren(...items);
    bar.hidden = false;
  } catch { hide(); }
}

// Per-host summary of the current filters (all hosts, even when one is selected).
function ago(ms) {
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

// Column sorting is done by the server (`sort`/`order`), so the 200-host cap applies after
// sorting. Text sorts ascending first, numbers and dates descending first; clicking again reverses.
let hostRows = [];
let hostSort = { key: 'count', dir: -1 };
try {
  const [k, d] = (localStorage.getItem('logpit-hosts-sort') || '').split(':');
  if (['host', 'count', 'errors', 'warnings', 'last_ts'].includes(k) && (d === '1' || d === '-1')) hostSort = { key: k, dir: Number(d) };
} catch {}

function sortBy(key) {
  hostSort = hostSort.key === key ? { key, dir: -hostSort.dir } : { key, dir: key === 'host' ? 1 : -1 };
  try { localStorage.setItem('logpit-hosts-sort', hostSort.key + ':' + hostSort.dir); } catch {}
  markSort();
  loadHosts();
}

for (const th of document.querySelectorAll('#hostsTable th[data-sort]')) {
  th.tabIndex = 0;
  th.title = 'Sort by ' + th.textContent.toLowerCase();
  th.onclick = () => sortBy(th.dataset.sort);
  th.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sortBy(th.dataset.sort); } };
}

function markSort() {
  for (const th of document.querySelectorAll('#hostsTable th[data-sort]')) {
    if (th.dataset.sort === hostSort.key) th.setAttribute('aria-sort', hostSort.dir === 1 ? 'ascending' : 'descending');
    else th.removeAttribute('aria-sort');
  }
}

function renderHosts() {
  markSort();
  $('hostsCount').textContent = '(' + hostRows.length + ')';
  $('hostsBody').replaceChildren(...hostRows.map(h => {
    const tr = document.createElement('tr');
    if (snap && h.host === snap.host) tr.className = 'active';
    const name = td('name', h.host);
    name.title = 'Filter on host ' + h.host;
    name.onclick = () => { $('host').value = h.host; load(); };
    if (h.silent) {
      const b = document.createElement('span');
      b.className = 'badge';
      b.textContent = 'silent';
      b.title = 'No logs received within the silence threshold';
      name.append(b);
    }
    const num = (v, cls) => td('n' + (v ? (cls ? ' ' + cls : '') : ' zero'), v.toLocaleString());
    const seen = td('', ago(h.last_ts));
    seen.title = new Date(h.last_ts).toLocaleString();
    tr.append(name, num(h.count), num(h.errors, 's3'), num(h.warnings, 's4'), seen);
    return tr;
  }));
}

let hostsReq = 0;
async function loadHosts() {
  if (!snap || !$('hosts').open) return;
  const req = ++hostsReq;
  const p = chartParams();
  p.delete('host');
  p.set('limit', '200');
  p.set('sort', hostSort.key);
  p.set('order', hostSort.dir === 1 ? 'asc' : 'desc');
  try {
    const res = await fetch('/api/hosts?' + p, { headers: authHeaders() });
    if (!res.ok) return;
    const rows = await res.json();
    if (req !== hostsReq) return; // a newer request (e.g. another sort click) superseded this one
    hostRows = rows;
    renderHosts();
  } catch {}
}
markSort();
try { $('hosts').open = localStorage.getItem('logpit-hosts-open') === '1'; } catch {}
$('hosts').addEventListener('toggle', () => {
  try { localStorage.setItem('logpit-hosts-open', $('hosts').open ? '1' : '0'); } catch {}
  loadHosts();
});

$('group').onchange = () => {
  try { localStorage.setItem('logpit-group', $('group').value); } catch {}
  loadChart();
};

async function load() {
  stopTail();
  takeSnapshot();
  if (snap.range === 'custom') $('live').checked = false;
  const p = new URLSearchParams({ limit: '500' });
  for (const k of ['q', 'host', 'app', 'level', 'f']) if ($(k).value.trim()) p.set(k, $(k).value.trim());
  applyWindow(p, snap);
  const headers = authHeaders();
  const token = $('token').value;
  if (token) { try { localStorage.setItem('logpit-token', token); } catch {} }
  try {
    const res = await fetch('/api/logs?' + p, { headers });
    if (res.status === 401) {
      $('rows').replaceChildren();
      $('empty').textContent = token ? 'Invalid token. Check the Token field above.' : 'This LogPit requires a token. Enter it in the Token field above, then press Search.';
      $('empty').hidden = false;
      $('status').textContent = 'unauthorized';
      $('token').focus();
      return;
    }
    if (res.status === 403) {
      $('rows').replaceChildren();
      $('empty').textContent = 'This token is not allowed to read logs (it has no read scope). Enter a token with read access.';
      $('empty').hidden = false;
      $('status').textContent = 'forbidden';
      $('token').focus();
      return;
    }
    if (!res.ok) throw new Error((await res.text()).slice(0, 120) || 'HTTP ' + res.status);
    const rows = await res.json();
    const body = $('rows');
    body.replaceChildren(...rows.map(rowEl));
    $('empty').textContent = 'No matching entries.';
    $('empty').hidden = rows.length > 0;
    $('status').textContent = rows.length + ' entries';
    loadChart();
    loadHosts();
    if ($('live').checked) startTail();
  } catch (e) { $('status').textContent = String(e.message || e); }
}

$('go').onclick = load;
$('token').addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
for (const id of ['q', 'host', 'app', 'f']) $(id).addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
$('level').onchange = load;
$('range').onchange = () => { if ($('range').value !== 'custom') leaveZoom(); load(); };
$('live').onchange = () => { if ($('live').checked) load(); else { stopTail(); load(); } };
load();
</script>
</body>
</html>
