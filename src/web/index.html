<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogPit</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1b1f24; --muted:#6a737d; --line:#d8dee4; --accent:#0969da; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#58a6ff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line); align-items:center; position:sticky; top:0; background:var(--bg); }
  h1 { font-size:16px; margin:0 8px 0 0; }
  input, select, button { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  input[type=search] { flex:1 1 240px; min-width:160px; }
  button { cursor:pointer; background:var(--accent); color:#fff; border-color:var(--accent); }
  label { color:var(--muted); display:flex; align-items:center; gap:4px; }
  #status { color:var(--muted); margin-left:auto; }
  table { width:100%; border-collapse:collapse; font:12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  td { padding:3px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  td.ts, td.host, td.app { white-space:nowrap; color:var(--muted); }
  td.msg { white-space:pre-wrap; word-break:break-word; width:100%; }
  .sev { font-weight:600; }
  .fields { margin-top:2px; display:flex; flex-wrap:wrap; gap:2px 8px; color:var(--muted); font-size:11.5px; }
  .fields span { cursor:pointer; } .fields span:hover { color:var(--accent); }
  .fields b { font-weight:600; }
  .s0,.s1,.s2,.s3 { color:#d1242f; } .s4 { color:#bf8700; } .s5 { color:#0969da; } .s6 { color:var(--muted); } .s7 { color:var(--muted); opacity:.7; }
  #empty { padding:24px 16px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>LogPit</h1>
  <input id="q" type="search" placeholder="Search messages…" autofocus>
  <input id="host" type="search" placeholder="Host" size="12">
  <input id="app" type="search" placeholder="App" size="12">
  <input id="f" type="search" placeholder="field:value" size="14" title="Filter on a structured field, e.g. act:blocked">
  <select id="level" title="Minimum severity">
    <option value="">All levels</option>
    <option value="3">Error and above</option>
    <option value="4">Warning and above</option>
    <option value="6">Info and above</option>
  </select>
  <select id="range" title="Time range">
    <option value="900000">Last 15 min</option>
    <option value="3600000" selected>Last hour</option>
    <option value="86400000">Last 24 h</option>
    <option value="604800000">Last 7 days</option>
    <option value="">All time</option>
  </select>
  <input id="token" type="password" placeholder="Token (if set)" size="12" autocomplete="off">
  <label title="Stream new entries as they arrive"><input id="live" type="checkbox"> Live</label>
  <button id="go">Search</button>
  <span id="status"></span>
</header>
<table><tbody id="rows"></tbody></table>
<div id="empty" hidden></div>
<script>
const $ = id => document.getElementById(id);
const LEVELS = ['emerg','alert','crit','err','warn','notice','info','debug'];
try { $('token').value = localStorage.getItem('logpit-token') || ''; } catch {}

function td(cls, text) { const c = document.createElement('td'); c.className = cls; c.textContent = text; return c; }

// Message cell: the message plus its structured fields (click a field to filter on it).
function msgCell(r) {
  const c = td('msg', r.message);
  const keys = Object.keys(r.fields || {}).filter(k => !k.startsWith('cef_') && k !== 'msg');
  if (keys.length) {
    const box = document.createElement('div');
    box.className = 'fields';
    for (const k of keys) {
      const s = document.createElement('span');
      const b = document.createElement('b');
      b.textContent = k + '=';
      s.append(b, document.createTextNode(r.fields[k]));
      s.title = 'Filter on ' + k + ':' + r.fields[k];
      s.onclick = () => { $('f').value = k + ':' + r.fields[k]; load(); };
      box.append(s);
    }
    c.append(box);
  }
  return c;
}

function rowEl(r) {
  const tr = document.createElement('tr');
  tr.append(
    td('ts', new Date(r.ts).toLocaleString()),
    td('sev s' + r.severity, LEVELS[r.severity] || r.severity),
    td('host', r.host), td('app', r.app), msgCell(r));
  return tr;
}

function authHeaders() {
  const token = $('token').value;
  return token ? { Authorization: 'Bearer ' + token } : {};
}

// Live tail: SSE over fetch (EventSource cannot send the Authorization header).
let tailCtl = null;
const MAX_LIVE_ROWS = 1000;

function stopTail() { if (tailCtl) tailCtl.abort(); tailCtl = null; }

function handleEvent(raw) {
  let name = 'message', data = '';
  for (const line of raw.split('\n')) {
    if (line.startsWith('event:')) name = line.slice(6).trim();
    else if (line.startsWith('data:')) data += line.slice(5).trimStart();
  }
  if (name === 'lagged') { $('status').textContent = 'live: skipped ' + data + ' entries'; return; }
  if (!data) return;
  const body = $('rows');
  body.prepend(rowEl(JSON.parse(data)));
  while (body.rows.length > MAX_LIVE_ROWS) body.deleteRow(-1);
  $('empty').hidden = true;
  $('status').textContent = 'live · ' + body.rows.length + ' entries';
}

async function startTail() {
  stopTail();
  const ctl = tailCtl = new AbortController();
  const p = new URLSearchParams();
  for (const k of ['q', 'host', 'app', 'level', 'f']) if ($(k).value.trim()) p.set(k, $(k).value.trim());
  while (tailCtl === ctl) {
    try {
      const res = await fetch('/api/tail?' + p, { headers: authHeaders(), signal: ctl.signal });
      if (!res.ok) throw new Error((await res.text()).slice(0, 120) || 'HTTP ' + res.status);
      $('status').textContent = 'live';
      const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
      let buf = '';
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += value.replace(/\r\n/g, '\n');
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) { handleEvent(buf.slice(0, i)); buf = buf.slice(i + 2); }
      }
    } catch (e) {
      if (ctl.signal.aborted) return;
      $('status').textContent = 'live: ' + String(e.message || e) + ' (retrying)';
    }
    if (tailCtl !== ctl) return;
    await new Promise(r => setTimeout(r, 3000));
  }
}

async function load() {
  stopTail();
  const p = new URLSearchParams({ limit: '500' });
  for (const k of ['q', 'host', 'app', 'level', 'f']) if ($(k).value.trim()) p.set(k, $(k).value.trim());
  if ($('range').value) p.set('since', String(Date.now() - Number($('range').value)));
  const headers = authHeaders();
  const token = $('token').value;
  if (token) { try { localStorage.setItem('logpit-token', token); } catch {} }
  try {
    const res = await fetch('/api/logs?' + p, { headers });
    if (res.status === 401) {
      $('rows').replaceChildren();
      $('empty').textContent = token ? 'Invalid token. Check the Token field above.' : 'This LogPit requires a token. Enter it in the Token field above, then press Search.';
      $('empty').hidden = false;
      $('status').textContent = 'unauthorized';
      $('token').focus();
      return;
    }
    if (!res.ok) throw new Error((await res.text()).slice(0, 120) || 'HTTP ' + res.status);
    const rows = await res.json();
    const body = $('rows');
    body.replaceChildren(...rows.map(rowEl));
    $('empty').textContent = 'No matching entries.';
    $('empty').hidden = rows.length > 0;
    $('status').textContent = rows.length + ' entries';
    if ($('live').checked) startTail();
  } catch (e) { $('status').textContent = String(e.message || e); }
}

$('go').onclick = load;
$('token').addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
for (const id of ['q', 'host', 'app', 'f']) $(id).addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
for (const id of ['level', 'range']) $(id).onchange = load;
$('live').onchange = () => { if ($('live').checked) load(); else { stopTail(); load(); } };
load();
</script>
</body>
</html>
