<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogPit</title>
<style>
  :root {
    color-scheme: light dark;
    --sans: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --ground:#fff; --band:#f2f2f2; --ink:#111; --muted:#5e5e5e; --rule:#d6d6d6; --field:#8a8a8a;
    --shell:#2d327d; --shell-ink:#fff; --shell-muted:#c3c6ea; --shell-line:#8f94c8; --shell-field:#fff; --shell-field-ink:#111;
    --accent:#2d327d; --focus:#2d327d; --band-hour:#111; --sel:#c9cbe8; --tint:#eceef8; --tint-strong:#d9dcf1;
    --primary:#d30000; --primary-hover:#b00000;
    --err:#d30000; --warn:#9a5300; --notice:#2d327d; --ok:#1b7a34; --new:#6b3fa0;
    --c0:#4e79a7; --c1:#f28e2b; --c2:#59a14f; --c3:#b07aa1; --c4:#76b7b2; --c5:#d4a92a; --c6:#ff9da7; --c7:#9c755f; --c8:#7b5fb5; --c9:#86bc86; --other:#8a8a8a;
    --chart-info:#868686; --chart-debug:#949494; --on-primary:#fff; --fresh:#fff1b8; --fresh-time:#111;
    --hdr:0px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme=light]) {
    color-scheme:dark;
    --ground:#141a46; --band:#1b2257; --ink:#f3f4fa; --muted:#a7acd4; --rule:#2b3170; --field:#6f76b3;
    --shell:#0b0f2e; --shell-muted:#a7acd4; --shell-line:#6f76b3; --shell-field:#141a46; --shell-field-ink:#f3f4fa;
    --accent:#ffd23f; --focus:#ffd23f; --band-hour:#ffd23f; --sel:#3a438f; --tint:#1f275f; --tint-strong:#2c3680;
    --primary:#c40000; --primary-hover:#a30000;
    --err:#ff6b6b; --warn:#ffb54d; --notice:#9cb0ff; --ok:#5fd38a; --new:#c7a6ff;
    --chart-info:#6f76b3; --chart-debug:#5f67a8; --fresh:#33303f; --fresh-time:#ffd23f; --c0:#8fb3e0; --c1:#ffa64d; --c2:#7fcf6f; --c3:#d6a3c9; --c4:#9ad9d3; --c5:#f5d76e; --c6:#ffb3bb; --c7:#c9a084; --c8:#c59fd9; --c9:#a8d8a8; --other:#a7acd4;
  } }
  :root[data-theme=light] { color-scheme:light; }
  :root[data-theme=dark] {
    color-scheme:dark;
    --ground:#141a46; --band:#1b2257; --ink:#f3f4fa; --muted:#a7acd4; --rule:#2b3170; --field:#6f76b3;
    --shell:#0b0f2e; --shell-muted:#a7acd4; --shell-line:#6f76b3; --shell-field:#141a46; --shell-field-ink:#f3f4fa;
    --accent:#ffd23f; --focus:#ffd23f; --band-hour:#ffd23f; --sel:#3a438f; --tint:#1f275f; --tint-strong:#2c3680;
    --primary:#c40000; --primary-hover:#a30000;
    --err:#ff6b6b; --warn:#ffb54d; --notice:#9cb0ff; --ok:#5fd38a; --new:#c7a6ff;
    --chart-info:#6f76b3; --chart-debug:#5f67a8; --fresh:#33303f; --fresh-time:#ffd23f; --c0:#8fb3e0; --c1:#ffa64d; --c2:#7fcf6f; --c3:#d6a3c9; --c4:#9ad9d3; --c5:#f5d76e; --c6:#ffb3bb; --c7:#c9a084; --c8:#c59fd9; --c9:#a8d8a8; --other:#a7acd4;
  }

  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  .skip { position:absolute; left:16px; top:-48px; z-index:30; padding:8px 12px; background:var(--ground); color:var(--ink); border:1px solid var(--field); font-weight:700; }
  .skip:focus { top:8px; }
  body { margin:0; background:var(--ground); color:var(--ink); font:14px/1.45 var(--sans); font-variant-numeric:tabular-nums; caret-color:var(--accent); scrollbar-color:var(--field) var(--ground); }
  ::selection { background:var(--sel); color:inherit; }
  :focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  input, select, button { font:inherit; color:inherit; }
  input, select { height:32px; padding:0 8px; border:1px solid var(--field); border-radius:2px; background:var(--ground); color:var(--ink); }
  input::placeholder { color:var(--muted); opacity:1; }
  input[type=checkbox] { width:16px; height:16px; margin:0; padding:0; accent-color:var(--primary); }
  button { height:32px; padding:0 12px; border:1px solid var(--field); border-radius:2px; background:var(--ground); color:var(--ink); font-weight:600; cursor:pointer; }
  button:hover { background:var(--band); }
  button:disabled { opacity:.6; cursor:default; }
  button.primary { background:var(--primary); border-color:var(--primary); color:var(--on-primary); }
  button.primary:hover { background:var(--primary-hover); }
  button.small { height:24px; padding:0 8px; font-size:12px; }
  button.link { height:auto; padding:0; border:0; background:none; font:inherit; color:inherit; text-align:left; }
  button.link:hover { background:none; color:var(--accent); }
  [role=button] { cursor:pointer; }
  [role=button]:hover { color:var(--accent); }
  @media (pointer:coarse) { input:not([type=checkbox]), select, button:not(.link) { min-height:44px; } button.small { min-height:36px; }
    .row1 label { min-height:44px; padding:0 4px; } input[type=checkbox] { width:22px; height:22px; } }

  /* Header: the platform-navy band carries the search; the row under it the secondary filters. */
  header { position:sticky; top:0; z-index:10; background:var(--shell); color:var(--shell-ink); }
  .row1 { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 16px; }
  h1 { margin:0 12px 0 0; font-size:20px; line-height:32px; font-weight:700; letter-spacing:-.01em; }
  .row1 input, .row1 select { background:var(--shell-field); color:var(--shell-field-ink); border-color:var(--shell-line); }
  .row1 label { display:flex; align-items:center; gap:6px; color:var(--shell-ink); font-weight:600; }
  .row1 button:not(.primary) { background:transparent; color:var(--shell-ink); border-color:var(--shell-line); }
  .row1 :focus-visible { outline-color:var(--shell-ink); }
  #q { flex:1 1 280px; min-width:180px; }
  #status { margin-left:auto; color:var(--shell-muted); font-size:13px; }
  #filtersToggle { display:none; }
  .row2 { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 16px; background:var(--band); color:var(--ink); border-bottom:1px solid var(--rule); }
  .row2 .sep { flex:1; }
  .row2 .tok { display:flex; align-items:center; gap:6px; color:var(--muted); }
  .prefs { position:relative; }
  .prefs summary { display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 10px; border:1px solid var(--field); border-radius:2px; background:var(--ground); font-weight:600; cursor:pointer; list-style:none; user-select:none; }
  .prefs summary::-webkit-details-marker { display:none; }
  .prefs .panel { position:absolute; right:0; top:calc(100% + 4px); z-index:20; display:grid; gap:10px; min-width:260px; padding:12px; background:var(--ground); border:1px solid var(--field); border-radius:2px; }
  .prefs .panel label { display:flex; justify-content:space-between; align-items:center; gap:12px; color:var(--muted); }
  .prefs .panel .cols { display:flex; flex-wrap:wrap; gap:6px 14px; }
  .prefs .panel .cols label { gap:6px; color:var(--ink); }
  .prefs .panel button { justify-self:start; }

  /* Work areas: the rail (hosts, top values, alerts, patterns) beside the chart and the stream. */
  .layout { display:grid; grid-template-columns:minmax(0, 1fr); }
  #rail { border-bottom:1px solid var(--rule); }
  @media (min-width:1100px) {
    .layout { grid-template-columns:340px minmax(0, 1fr); grid-template-areas:"rail bar" "rail chart" "rail axis" "rail stream"; grid-template-rows:auto auto auto 1fr; }
    #rail { grid-area:rail; position:sticky; top:var(--hdr); align-self:start; max-height:calc(100vh - var(--hdr)); overflow:auto; border-bottom:0; border-right:1px solid var(--rule); }
    #chartbar { grid-area:bar; } #chart { grid-area:chart; } #axis { grid-area:axis; } .stream { grid-area:stream; }
  }
  #rail details { border-bottom:1px solid var(--rule); font-size:12.5px; }
  #rail details:last-child { border-bottom:0; }
  #rail summary { padding:10px 16px; font-size:13px; font-weight:700; cursor:pointer; list-style:none; }
  #rail summary::-webkit-details-marker { display:none; }
  #rail summary::before { content:''; display:inline-block; width:6px; height:6px; margin:0 10px 2px 2px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(-45deg); }
  #rail details[open] > summary::before { transform:rotate(45deg); }
  #rail summary h2 { display:inline; margin:0; font:inherit; }
  #rail summary span { color:var(--muted); font-weight:400; }
  #rail .body { padding:0 16px 12px; }
  .note { color:var(--muted); margin-bottom:6px; }

  #hostsTable { width:100%; border-collapse:collapse; }
  #hostsTable th { text-align:left; font-size:12px; font-weight:600; color:var(--muted); padding:4px 8px 4px 0; border-bottom:1px solid var(--rule); white-space:nowrap; }
  #hostsTable th[data-sort] { cursor:pointer; user-select:none; } #hostsTable th[data-sort]:hover { color:var(--accent); }
  #hostsTable th[aria-sort]::after { content:''; display:inline-block; margin:0 0 2px 5px; border:4px solid transparent; border-top:0; border-bottom:5px solid currentColor; vertical-align:middle; }
  #hostsTable th[aria-sort=descending]::after { border-bottom:0; border-top:5px solid currentColor; }
  #hostsTable th.n, #hostsTable td.n { text-align:right; }
  #hostsTable td { padding:4px 8px 4px 0; border-bottom:1px solid var(--rule); white-space:nowrap; vertical-align:baseline; }
  #hostsTable td.name { white-space:normal; font-weight:600; }
  #hostsTable tr.active td.name > [role=button] { color:var(--accent); text-decoration:underline; text-underline-offset:3px; }
  #hostsTable td.zero { color:var(--muted); }
  #hostsTable td.s3 { color:var(--err); font-weight:700; } #hostsTable td.s4 { color:var(--warn); font-weight:700; }
  .badge { display:inline-block; margin-left:6px; padding:0 5px; border-radius:2px; background:var(--err); color:var(--ground); font:700 11px/16px var(--sans); }
  .tag { display:inline-block; margin:2px 4px 0 0; padding:0 5px; border:1px solid var(--field); border-radius:2px; font:400 11px/16px var(--sans); color:var(--muted); }

  .topctl { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; margin-bottom:8px; color:var(--muted); }
  .topctl label { display:flex; align-items:center; gap:6px; }
  .topctl select { height:28px; }
  .toprow { display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:2px 10px; align-items:baseline; padding:3px 0; }
  .toprow .v { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:var(--mono); }
  .toprow .bar { grid-column:1 / -1; grid-row:2; height:4px; background:var(--notice); min-width:1px; }
  .toprow .n { text-align:right; color:var(--muted); } .toprow .n b { color:var(--ink); }

  .alrow { display:grid; grid-template-columns:auto auto minmax(0, 1fr) auto; gap:2px 10px; align-items:baseline; padding:6px 0; border-bottom:1px solid var(--rule); }
  .alrow:last-child { border-bottom:0; }
  .alrow > span:first-child { color:var(--muted); white-space:nowrap; }
  .alrow .k { font-weight:700; white-space:nowrap; } .alrow .k.bad { color:var(--err); } .alrow .k.ok { color:var(--ok); }
  .alrow .h { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .alrow .m { grid-column:1 / -1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .alrow .d { grid-row:1; grid-column:4; color:var(--muted); white-space:nowrap; }

  .patrow { display:grid; grid-template-columns:auto auto minmax(0, 1fr); gap:2px 10px; align-items:baseline; padding:6px 0; border-bottom:1px solid var(--rule); }
  .patrow:last-child { border-bottom:0; }
  .patrow .n { font-weight:700; }
  .patrow .p { grid-column:1 / -1; grid-row:2; font-family:var(--mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .patrow .m { color:var(--muted); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .patrow .t { white-space:nowrap; font-weight:600; } .t.up { color:var(--err); } .t.new { color:var(--new); } .t.down { color:var(--ok); } .t.flat { color:var(--muted); }
  #alertList:empty::after { content:'No notifications yet.'; color:var(--muted); }
  #patList:empty::after { content:'No entries in the current results.'; color:var(--muted); }
  #topList:empty::after { content:'No values for this field in the current results.'; color:var(--muted); }

  /* Volume chart. */
  #chartbar { display:flex; flex-wrap:wrap; align-items:center; gap:6px 16px; padding:10px 16px 6px; font-size:12.5px; color:var(--muted); }
  #chartbar label { display:flex; align-items:center; gap:6px; }
  #chartbar select { height:28px; }
  #chartbar .exp { margin-left:auto; display:flex; align-items:center; gap:6px; }
  #legend { display:flex; flex-wrap:wrap; gap:2px 14px; }
  .lg { display:inline-flex; align-items:center; gap:6px; }
  .lg i { width:10px; height:10px; background:currentColor; display:inline-block; }
  #legend i.s6 { color:var(--chart-info); } #legend i.s7 { color:var(--chart-debug); }
  .lg b { color:var(--ink); }
  #chart { display:block; width:calc(100% - 32px); height:72px; margin:0 16px; border-bottom:1px solid var(--ink); touch-action:pan-y; user-select:none; }
  #axis { position:relative; height:18px; margin:0 16px; font-size:11px; font-weight:700; overflow:hidden; }
  #axis span { position:absolute; top:2px; padding-left:3px; border-left:1px solid var(--ink); line-height:14px; white-space:nowrap; }
  #chart rect { fill:currentColor; }
  #chart .s6 { color:var(--chart-info); } #chart .s7 { color:var(--chart-debug); }
  #chart .hit { fill:transparent; cursor:zoom-in; } #chart .hit:hover { fill:var(--accent); fill-opacity:.18; }
  #chart .hit.flat { cursor:default; }
  #chart .sel { fill:var(--accent); fill-opacity:.3; stroke:var(--accent); stroke-width:1; vector-effect:non-scaling-stroke; pointer-events:none; }

  /* The stream, set like a timetable: the hour once on its band, minutes and seconds on each line. */
  .stream { min-width:0; padding-top:8px; }
  #stream { width:100%; border-collapse:collapse; }
  #stream td { padding:4px 10px; border-bottom:1px solid var(--rule); vertical-align:baseline; }
  #stream td:first-child { padding-left:16px; }
  #stream td.ts { width:1%; white-space:nowrap; font-weight:700; }
  #stream td.ts .hh { color:var(--muted); font-weight:400; }
  #stream tr.e td.ts { color:var(--err); } #stream tr.e td.ts .hh { color:inherit; }
  #stream td.sev { width:1%; white-space:nowrap; font-size:12px; font-weight:700; }
  #stream td.host, #stream td.app { width:1%; max-width:14em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); }
  #stream td.host { color:var(--ink); font-weight:600; }
  #stream td.msg { font:12.5px/1.45 var(--mono); white-space:pre-wrap; word-break:break-word; }
  /* A line that just arrived live is lit, then put out, both in one step (no fade). */
  #stream tr.fresh, #stream tr.fresh > td { background:var(--fresh); }
  #stream tr.fresh:not(.e) td.ts { color:var(--fresh-time); }
  #stream tr.band th { position:sticky; top:var(--hdr); z-index:1; padding:8px 10px 6px 16px; background:var(--band); border-bottom:1px solid var(--ink); text-align:left; font-weight:400; }
  .band .h { font-size:20px; font-weight:700; line-height:1; margin-right:10px; color:var(--band-hour); }
  .band .d { color:var(--muted); }
  .band .c { float:right; font-size:12.5px; color:var(--muted); }
  .band .c .e { color:var(--err); font-weight:700; } .band .c .w { color:var(--warn); font-weight:700; }
  .sev { font-weight:700; }
  .s0, .s1, .s2, .s3 { color:var(--err); } .s4 { color:var(--warn); } .s5 { color:var(--notice); } .s6, .s7 { color:var(--muted); }
  .fields { margin-top:3px; display:flex; flex-wrap:wrap; gap:2px 10px; color:var(--muted); font-size:11.5px; }
  .fields b { font-weight:600; }
  .fields .tracebtn { color:var(--accent); font-weight:600; text-decoration:underline; text-underline-offset:3px; }
  body.compact #stream td { padding-top:1px; padding-bottom:1px; } body.compact #stream { font-size:12px; } body.compact #stream td.msg { font-size:11.5px; line-height:1.3; }
  body.compact #stream tr.band th { padding-top:4px; padding-bottom:3px; } body.compact .band .h { font-size:14px; }
  body.nowrap #stream td.msg { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:0; }
  body.hide-ts td.ts, body.hide-sev td.sev, body.hide-host td.host, body.hide-app td.app, body.hide-fields .fields { display:none; }

  tr.ctx > td { padding:8px 16px 12px 32px !important; background:var(--tint); }
  .ctxhead { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; margin-bottom:6px; color:var(--muted); font:12.5px var(--sans); }
  .ctxline { display:grid; grid-template-columns:auto 4.5em 9em minmax(0, 1fr); gap:0 10px; padding:1px 0; font:12px/1.45 var(--mono); }
  .ctxline > span:first-child, .ctxline .app { color:var(--muted); white-space:nowrap; }
  .ctxline .m { white-space:pre-wrap; word-break:break-word; }
  .ctxline.cur { background:var(--tint-strong); font-weight:700; }

  #morebar { text-align:center; padding:16px; }
  #empty { padding:32px 16px; color:var(--muted); font-size:14px; }

  @media (max-width:759px) {
    header { position:static; }
    #filtersToggle { display:inline-flex; align-items:center; }
    header:not(.filters-open) .row2 { display:none; }
    #status { flex-basis:100%; margin-left:0; }
    #stream tr.band th { top:0; }
    #stream tr.entry { display:grid; grid-template-columns:auto auto auto minmax(0, 1fr); column-gap:10px; padding:6px 16px; border-bottom:1px solid var(--rule); }
    #stream tr.entry td { padding:0 !important; border:0; width:auto; max-width:none; }
    #stream tr.entry td.msg { grid-column:1 / -1; margin-top:2px; }
    body.nowrap #stream tr.entry td.msg { max-width:none; }
    tr.ctx > td { padding:8px 16px 12px !important; }
    .ctxline { grid-template-columns:auto auto minmax(0, 1fr); }
    .ctxline .m { grid-column:1 / -1; }
  }
</style>
</head>
<body>
<a class="skip" href="#stream">Skip to the results</a>
<header>
  <div class="row1">
    <h1>LogPit</h1>
    <input id="q" type="search" placeholder="Search messages…" aria-label="Search messages" autofocus title="Words must all match. Use OR between alternatives, -word or NOT word to exclude, &quot;a phrase&quot; for adjacent words, and prefix* for prefixes. Example: disk error OR timeout -debug">
    <select id="level" title="Minimum severity" aria-label="Minimum severity">
      <option value="">All levels</option>
      <option value="3">Error and above</option>
      <option value="4">Warning and above</option>
      <option value="6">Info and above</option>
    </select>
    <select id="range" title="Time range" aria-label="Time range">
      <option value="900000">Last 15 min</option>
      <option value="3600000" selected>Last hour</option>
      <option value="86400000">Last 24 h</option>
      <option value="604800000">Last 7 days</option>
      <option value="">All time</option>
    </select>
    <label title="Stream new entries as they arrive"><input id="live" type="checkbox"> Live</label>
    <button id="go" class="primary">Search</button>
    <button id="filtersToggle" type="button" aria-expanded="false" aria-controls="filters">Filters<span id="filterCount"></span></button>
    <span id="status" role="status"></span>
  </div>
  <div class="row2" id="filters">
    <input id="host" type="search" placeholder="Host" aria-label="Host" size="12">
    <input id="app" type="search" placeholder="App" aria-label="App" size="12">
    <select id="tag" hidden aria-label="Host tag" title="Only the hosts that have this tag (see [[tags]] in the configuration)"><option value="">All tags</option></select>
    <input id="f" type="search" placeholder="field:value" aria-label="Field filter" size="14" title="Filter on a structured field: act:blocked (exact), status>=500 (also &gt;, &lt;, &lt;=, numbers only), act!=block, src~^10\. (regular expression). The field must be present.">
    <input id="re" type="search" placeholder="Regex on message" aria-label="Regular expression on message" size="18" title="Keep messages matching a regular expression, e.g. timeout|refused or (?i)error [0-9]+. It scans the entries left by the other filters, so narrow the time range first.">
    <span class="sep"></span>
    <select id="views" aria-label="Saved views" title="Saved views, shared by everyone who uses this LogPit"><option value="">Views</option></select>
    <button id="saveView" type="button" title="Save the current search, time range and chart grouping under a name">Save view</button>
    <button id="delView" type="button" title="Delete the selected view" hidden>Delete</button>
    <label class="tok">Token <input id="token" type="password" placeholder="if set" size="12" autocomplete="off"></label>
    <details class="prefs" id="prefs">
      <summary title="Display preferences, kept in this browser"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5"/><circle cx="5" cy="4" r="2" fill="currentColor"/><circle cx="11" cy="8" r="2" fill="currentColor"/><circle cx="7" cy="12" r="2" fill="currentColor"/></svg>Display</summary>
      <div class="panel">
        <label>Theme <select id="prefTheme"><option value="auto">Follow the system</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
        <label>Times <select id="prefTime"><option value="local">Local time</option><option value="utc">UTC</option><option value="iso">ISO 8601 (UTC)</option></select></label>
        <label>Density <select id="prefDensity"><option value="normal">Comfortable</option><option value="compact">Compact</option></select></label>
        <label>Long messages <select id="prefWrap"><option value="wrap">Wrap</option><option value="nowrap">One line</option></select></label>
        <div class="cols" title="Columns of the table"><label><input type="checkbox" data-col="ts"> Time</label><label><input type="checkbox" data-col="sev"> Level</label><label><input type="checkbox" data-col="host"> Host</label><label><input type="checkbox" data-col="app"> App</label><label><input type="checkbox" data-col="fields"> Fields</label></div>
        <button id="prefReset" type="button" class="small">Reset</button>
      </div>
    </details>
  </div>
</header>
<div class="layout">
<div id="chartbar" hidden>
  <label>Stack by
    <select id="group"><option value="severity">severity</option><option value="host">host</option><option value="app">app</option></select>
  </label>
  <div id="legend"></div>
  <span class="exp">Export
    <button id="expNdjson" type="button" class="small" title="Download the matching entries as NDJSON (up to 100,000)">NDJSON</button>
    <button id="expCsv" type="button" class="small" title="Download the matching entries as CSV (up to 100,000)">CSV</button>
  </span>
</div>
<svg id="chart" viewBox="0 0 1 1" preserveAspectRatio="none" role="img" aria-label="Volume over time" hidden></svg>
<div id="axis" aria-hidden="true" hidden></div>
<aside id="rail" aria-label="Hosts and analysis">
<details id="hosts">
  <summary><h2>Hosts <span id="hostsCount"></span></h2></summary>
  <div class="body">
  <table id="hostsTable">
    <thead><tr><th data-sort="host">Host</th><th class="n" data-sort="count">Entries</th><th class="n" data-sort="errors" title="Errors">Err</th><th class="n" data-sort="warnings" title="Warnings">Warn</th><th data-sort="last_ts">Seen</th></tr></thead>
    <tbody id="hostsBody"></tbody>
  </table>
  </div>
</details>
<details id="top">
  <summary><h2>Top values <span id="topMeta"></span></h2></summary>
  <div class="body">
  <div class="topctl"><label>Field <select id="topField"></select></label><span id="topNote"></span></div>
  <div id="topList"></div>
  </div>
</details>
<details id="patterns">
  <summary><h2>Message patterns <span id="patMeta"></span></h2></summary>
  <div class="body">
  <div id="patNote" class="note"></div>
  <div id="patList"></div>
  </div>
</details>
<details id="alerts">
  <summary><h2>Alerts <span id="alertsMeta"></span></h2></summary>
  <div class="body"><div id="alertList"></div></div>
</details>
</aside>
<main class="stream">
<table id="stream" tabindex="-1" aria-label="Log entries"><tbody id="rows"></tbody></table>
<div id="morebar" hidden><button id="more" type="button">Load more</button></div>
<div id="empty" hidden></div>
</main>
</div>
<script>
const $ = id => document.getElementById(id);
const LEVELS = ['emerg','alert','crit','err','warn','notice','info','debug'];
try { $('token').value = localStorage.getItem('logpit-token') || ''; } catch {}

function td(cls, text) { const c = document.createElement('td'); c.className = cls; c.textContent = text; return c; }

// Something to click that is not a button element still answers to the keyboard.
function clickable(el, fn, title) {
  el.tabIndex = 0;
  el.setAttribute('role', 'button');
  if (title) el.title = title;
  el.onclick = fn;
  el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } };
  return el;
}

// Message cell: the message plus its structured fields (click a field to filter on it).
function msgCell(r, tr) {
  const c = td('msg', r.message);
  const keys = Object.keys(r.fields || {}).filter(k => !k.startsWith('cef_') && k !== 'msg');
  if (keys.length) {
    const box = document.createElement('div');
    box.className = 'fields';
    for (const k of keys) {
      const s = document.createElement('span');
      const b = document.createElement('b');
      b.textContent = k + '=';
      s.append(b, document.createTextNode(r.fields[k]));
      clickable(s, () => { $('f').value = k + ':' + r.fields[k]; load(); }, 'Filter on ' + k + ':' + r.fields[k]);
      box.append(s);
      // A trace id also opens the whole trace, across hosts, under the line.
      if (k === 'trace_id' && tr) {
        const t = document.createElement('span');
        t.className = 'tracebtn';
        t.textContent = 'trace';
        clickable(t, () => togglePanel(tr, 'trace', box => fillTrace(box, r)), 'Show every entry of this trace');
        box.append(t);
      }
    }
    c.append(box);
  }
  return c;
}

// Clicking a timestamp shows the entries around that line (the same host by default).
// Entries that arrived through the live stream have no id yet, so they cannot be expanded.
const CONTEXT_STEP = 10;
function ctxTime(ts) {
  const d = new Date(ts);
  if (prefs.time === 'utc' || prefs.time === 'iso') return d.toISOString().slice(11, 23);
  return d.toLocaleTimeString([], { hour12: false }) + '.' + String(d.getMilliseconds()).padStart(3, '0');
}

async function fillContext(box, row, opts) {
  box.replaceChildren(document.createTextNode('Loading…'));
  try {
    const q = new URLSearchParams({ lines: String(opts.lines), scope: opts.scope });
    const res = await fetch('/api/logs/' + row.id + '/context?' + q, { headers: authHeaders() });
    if (res.status === 404) { box.textContent = 'This entry is no longer stored.'; return; }
    if (!res.ok) throw new Error((await res.text()).slice(0, 120) || 'HTTP ' + res.status);
    const d = await res.json();

    const head = document.createElement('div');
    head.className = 'ctxhead';
    const title = document.createElement('span');
    title.textContent = 'Around this entry, oldest first (' + (opts.scope === 'host' ? 'host ' + row.host : 'all hosts') + ')';
    const more = document.createElement('button');
    more.type = 'button'; more.className = 'small'; more.textContent = '+' + CONTEXT_STEP + ' lines';
    more.disabled = opts.lines >= 100;
    more.onclick = () => fillContext(box, row, { ...opts, lines: Math.min(100, opts.lines + CONTEXT_STEP) });
    const scope = document.createElement('button');
    scope.type = 'button'; scope.className = 'small'; scope.textContent = opts.scope === 'host' ? 'all hosts' : 'this host only';
    scope.onclick = () => fillContext(box, row, { ...opts, scope: opts.scope === 'host' ? 'all' : 'host' });
    const close = document.createElement('button');
    close.type = 'button'; close.className = 'small'; close.textContent = 'close';
    close.onclick = () => box.closest('tr').remove();
    head.append(title, more, scope, close);

    const line = (r, cur) => {
      const el = document.createElement('div');
      el.className = 'ctxline ' + (cur ? 'cur' : r.host === row.host ? '' : 'other');
      const t = document.createElement('span'); t.textContent = ctxTime(r.ts);
      const sev = document.createElement('span'); sev.className = 'sev s' + r.severity; sev.textContent = LEVELS[r.severity] || r.severity;
      const app = document.createElement('span'); app.className = 'app'; app.textContent = (opts.scope === 'all' ? r.host + ' ' : '') + r.app;
      const m = document.createElement('span'); m.className = 'm'; m.textContent = r.message;
      el.append(t, sev, app, m);
      return el;
    };
    box.replaceChildren(head, ...d.before.map(r => line(r, false)), line(d.entry, true), ...d.after.map(r => line(r, false)));
  } catch (e) { box.textContent = 'Could not load the context: ' + String(e.message || e); }
}

// The panel under a line (its context or its trace): the same button closes it, another replaces it.
function togglePanel(tr, kind, fill) {
  const next = tr.nextElementSibling;
  if (next && next.classList.contains('ctx')) {
    next.remove();
    if (next.dataset.kind === kind) return;
  }
  const ctx = document.createElement('tr');
  ctx.className = 'ctx';
  ctx.dataset.kind = kind;
  const cell = document.createElement('td');
  cell.colSpan = 5;
  ctx.append(cell);
  tr.after(ctx);
  fill(cell);
}

function toggleContext(tr, row) {
  togglePanel(tr, 'context', cell => fillContext(cell, row, { lines: 5, scope: 'host' }));
}

// Every entry sharing the line's trace id, oldest first, with the time since the first one.
const TRACE_LIMIT = 500;
async function fillTrace(box, row) {
  const id = row.fields.trace_id;
  box.replaceChildren(document.createTextNode('Loading…'));
  try {
    const res = await fetch('/api/logs?' + new URLSearchParams({ trace: id, limit: String(TRACE_LIMIT) }), { headers: authHeaders() });
    if (!res.ok) throw new Error((await res.text()).slice(0, 120) || 'HTTP ' + res.status);
    const rows = (await res.json()).sort((a, b) => a.ts - b.ts || a.id - b.id);
    const hosts = new Set(rows.map(r => r.host));
    const span = rows.length ? rows[rows.length - 1].ts - rows[0].ts : 0;

    const head = document.createElement('div');
    head.className = 'ctxhead';
    const title = document.createElement('span');
    title.textContent = 'Trace ' + id + ': ' + rows.length + (rows.length === TRACE_LIMIT ? '+' : '') + ' entries on ' +
      hosts.size + ' host' + (hosts.size === 1 ? '' : 's') + ' over ' + span + ' ms, oldest first';
    const only = document.createElement('button');
    only.type = 'button'; only.className = 'small'; only.textContent = 'search it';
    only.onclick = () => { $('f').value = 'trace_id:' + id; load(); };
    const close = document.createElement('button');
    close.type = 'button'; close.className = 'small'; close.textContent = 'close';
    close.onclick = () => box.closest('tr').remove();
    head.append(title, only, close);

    const line = r => {
      const el = document.createElement('div');
      el.className = 'ctxline' + (r.id === row.id ? ' cur' : '');
      const t = document.createElement('span'); t.textContent = '+' + (r.ts - rows[0].ts) + ' ms';
      t.title = fmtTime(r.ts);
      const sev = document.createElement('span'); sev.className = 'sev s' + r.severity; sev.textContent = LEVELS[r.severity] || r.severity;
      const app = document.createElement('span'); app.className = 'app'; app.textContent = r.host + ' ' + r.app;
      const m = document.createElement('span'); m.className = 'm'; m.textContent = r.message;
      el.append(t, sev, app, m);
      return el;
    };
    box.replaceChildren(head, ...rows.map(line));
  } catch (e) { box.textContent = 'Could not load the trace: ' + String(e.message || e); }
}

// Display preferences, kept in this browser: theme, how times are written, density, wrapping and the
// columns shown. They only change how the page looks, never what is asked of the server.
const PREF_DEFAULTS = { theme: 'auto', time: 'local', density: 'normal', wrap: 'wrap', hide: [] };
let prefs = { ...PREF_DEFAULTS };
try { prefs = { ...PREF_DEFAULTS, ...JSON.parse(localStorage.getItem('logpit-prefs') || '{}') }; } catch {}
if (!Array.isArray(prefs.hide)) prefs.hide = [];
function fmtTime(ms) {
  const d = new Date(ms);
  if (prefs.time === 'utc') return d.toISOString().replace('T', ' ').replace('Z', ' UTC');
  if (prefs.time === 'iso') return d.toISOString();
  return d.toLocaleString();
}
function applyPrefs() {
  const root = document.documentElement;
  if (prefs.theme === 'light' || prefs.theme === 'dark') root.dataset.theme = prefs.theme; else delete root.dataset.theme;
  document.body.classList.toggle('compact', prefs.density === 'compact');
  document.body.classList.toggle('nowrap', prefs.wrap === 'nowrap');
  for (const c of ['ts', 'sev', 'host', 'app', 'fields']) document.body.classList.toggle('hide-' + c, prefs.hide.includes(c));
}
function savePrefs() { try { localStorage.setItem('logpit-prefs', JSON.stringify(prefs)); } catch {} }
function syncPrefControls() {
  $('prefTheme').value = prefs.theme; $('prefTime').value = prefs.time;
  $('prefDensity').value = prefs.density; $('prefWrap').value = prefs.wrap;
  for (const c of document.querySelectorAll('#prefs [data-col]')) c.checked = !prefs.hide.includes(c.dataset.col);
}
for (const [id, key] of [['prefTheme', 'theme'], ['prefTime', 'time'], ['prefDensity', 'density'], ['prefWrap', 'wrap']]) {
  $(id).onchange = () => {
    prefs[key] = $(id).value; savePrefs(); applyPrefs();
    if (key === 'time') load(); // rows were written with the old format
  };
}
for (const c of document.querySelectorAll('#prefs [data-col]')) {
  c.onchange = () => {
    prefs.hide = prefs.hide.filter(x => x !== c.dataset.col);
    if (!c.checked) prefs.hide.push(c.dataset.col);
    savePrefs(); applyPrefs();
  };
}
$('prefReset').onclick = () => { const t = prefs.time; prefs = { ...PREF_DEFAULTS }; savePrefs(); applyPrefs(); syncPrefControls(); if (t !== 'local') load(); };
document.addEventListener('click', e => { if (!$('prefs').contains(e.target)) $('prefs').open = false; });
applyPrefs();

// The stream is set like a timetable: a band states the hour once (in the chosen time zone) with
// its counts, and each line leads with its minutes and seconds.
function hourOf(ms) {
  const d = new Date(ms), utc = prefs.time !== 'local';
  const h = utc ? d.getUTCHours() : d.getHours();
  const key = utc ? d.toISOString().slice(0, 13) : d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate() + '-' + h;
  return { d, utc, h, key };
}
function bandEl(ms) {
  const { d, utc, h, key } = hourOf(ms);
  const tr = document.createElement('tr');
  tr.className = 'band';
  Object.assign(tr, { _key: key, _n: 0, _e: 0, _w: 0 });
  const th = document.createElement('th');
  th.colSpan = 5; th.scope = 'colgroup';
  const hh = document.createElement('span'); hh.className = 'h'; hh.textContent = String(h).padStart(2, '0') + ':00';
  const day = document.createElement('span'); day.className = 'd';
  day.textContent = prefs.time === 'iso' ? d.toISOString().slice(0, 10) + ' UTC'
    : d.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', ...(utc ? { timeZone: 'UTC' } : {}) }) + (utc ? ' UTC' : '');
  tr._c = document.createElement('span'); tr._c.className = 'c';
  th.append(hh, day, tr._c);
  tr.append(th);
  return tr;
}
function countInBand(band, r, k, paint = true) {
  band._n += k;
  if (r.severity <= 3) band._e += k; else if (r.severity === 4) band._w += k;
  if (paint) paintBand(band);
}
function paintBand(band) {
  const parts = [document.createTextNode(band._n.toLocaleString() + (band._n === 1 ? ' entry' : ' entries'))];
  const add = (n, cls, word) => { if (!n) return; const s = document.createElement('span'); s.className = cls; s.textContent = n.toLocaleString() + ' ' + word; parts.push(document.createTextNode(' · '), s); };
  add(band._e, 'e', band._e === 1 ? 'error' : 'errors');
  add(band._w, 'w', band._w === 1 ? 'warning' : 'warnings');
  band._c.replaceChildren(...parts);
}

function rowEl(r) {
  const tr = document.createElement('tr');
  tr.className = 'entry' + (r.severity <= 3 ? ' e' : '');
  tr._r = r;
  const { d, utc } = hourOf(r.ts);
  const two = n => String(n).padStart(2, '0');
  const hh = document.createElement('span'); hh.className = 'hh';
  hh.textContent = two(utc ? d.getUTCHours() : d.getHours()) + ':';
  const ms = document.createTextNode(two(utc ? d.getUTCMinutes() : d.getMinutes()) + ':' + two(utc ? d.getUTCSeconds() : d.getSeconds()));
  const ts = td('ts', '');
  if (r.id !== undefined) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'link';
    b.title = fmtTime(r.ts) + ' · show the entries around this one';
    b.onclick = () => toggleContext(tr, r);
    b.append(hh, ms);
    ts.append(b);
  } else {
    ts.title = fmtTime(r.ts);
    ts.append(hh, ms);
  }
  tr.append(
    ts,
    td('sev s' + r.severity, LEVELS[r.severity] || r.severity),
    td('host', r.host), td('app', r.app), msgCell(r, tr));
  return tr;
}

// Entries shown, and the first and last hour bands, so pages and live lines join the right band.
let entries = 0, firstBand = null, lastBand = null;
function addRows(rows, append) {
  const frag = document.createDocumentFragment();
  if (!append) { entries = 0; firstBand = lastBand = null; }
  let band = lastBand;
  const touched = new Set();
  for (const r of rows) {
    const key = hourOf(r.ts).key;
    if (!band || band._key !== key) { band = bandEl(r.ts); frag.append(band); firstBand = firstBand || band; }
    const tr = rowEl(r);
    tr._band = band;
    frag.append(tr);
    countInBand(band, r, 1, false);
    touched.add(band);
  }
  touched.forEach(paintBand);
  lastBand = band;
  entries += rows.length;
  if (append) $('rows').append(frag); else $('rows').replaceChildren(frag);
}

function authHeaders() {
  const token = $('token').value;
  return token ? { Authorization: 'Bearer ' + token } : {};
}

// Live tail: SSE over fetch (EventSource cannot send the Authorization header).
let tailCtl = null;
const MAX_LIVE_ROWS = 1000;

let chartTimer = null, chartBusy = false;
const CHART_REFRESH_MS = 5000;

function stopTail() {
  if (tailCtl) tailCtl.abort();
  tailCtl = null;
  clearTimeout(liveTimer);
  liveTimer = 0;
  liveQueue = [];
  clearInterval(chartTimer);
  chartTimer = null;
}

// While live, redraw the histogram periodically so it follows the stream.
async function refreshChart() {
  if (document.hidden || chartBusy) return;
  chartBusy = true;
  try { await Promise.all([loadChart(), loadHosts(), loadTop(), loadPatterns(), loadAlerts()]); } finally { chartBusy = false; }
}

function handleEvent(raw) {
  let name = 'message', data = '';
  for (const line of raw.split('\n')) {
    if (line.startsWith('event:')) name = line.slice(6).trim();
    else if (line.startsWith('data:')) data += line.slice(5).trimStart();
  }
  if (name === 'lagged') { $('status').textContent = 'live: skipped ' + data + ' entries'; return; }
  if (!data) return;
  liveQueue.push(JSON.parse(data));
  if (!liveTimer) liveTimer = setTimeout(flushLive, LIVE_BATCH_MS);
}

// Live lines are inserted in batches, so a burst costs one DOM update instead of one per line.
let liveQueue = [], liveTimer = 0;
const LIVE_BATCH_MS = 100;
const FRESH_MS = 3000; // how long a line that arrived live stays highlighted
function flushLive() {
  liveTimer = 0;
  const body = $('rows'), batch = liveQueue;
  liveQueue = [];
  const fresh = [];
  for (const r of batch) {
    let band = firstBand;
    if (!band || band._key !== hourOf(r.ts).key) {
      band = bandEl(r.ts);
      body.prepend(band);
      firstBand = band;
      lastBand = lastBand || band;
    }
    const tr = rowEl(r);
    tr._band = band;
    band.after(tr);
    countInBand(band, r, 1);
    entries++;
    tr.classList.add('fresh');
    fresh.push(tr);
  }
  setTimeout(() => fresh.forEach(tr => tr.classList.remove('fresh')), FRESH_MS);
  // Drop the oldest lines beyond the cap, with their context panels and emptied bands.
  while (entries > MAX_LIVE_ROWS) {
    const el = body.lastElementChild;
    if (el._r) { entries--; countInBand(el._band, el._r, -1); }
    el.remove();
  }
  while (body.lastElementChild && !body.lastElementChild._r && body.lastElementChild.classList.contains('band')) body.lastElementChild.remove();
  let last = body.lastElementChild;
  while (last && !last._band) last = last.previousElementSibling;
  lastBand = last ? last._band : null;
  if (!lastBand) firstBand = null;
  $('empty').hidden = true;
  $('status').textContent = 'live · ' + entries + ' entries';
}

async function startTail() {
  stopTail();
  const ctl = tailCtl = new AbortController();
  chartTimer = setInterval(refreshChart, CHART_REFRESH_MS);
  const p = new URLSearchParams();
  for (const k of SNAP_KEYS) if (snap[k]) p.set(k, snap[k]);
  while (tailCtl === ctl) {
    try {
      const res = await fetch('/api/tail?' + p, { headers: authHeaders(), signal: ctl.signal });
      if (!res.ok) throw new Error((await res.text()).slice(0, 120) || 'HTTP ' + res.status);
      $('status').textContent = 'live';
      const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
      let buf = '';
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += value.replace(/\r\n/g, '\n');
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) { handleEvent(buf.slice(0, i)); buf = buf.slice(i + 2); }
      }
    } catch (e) {
      if (ctl.signal.aborted) return;
      $('status').textContent = 'live: ' + String(e.message || e) + ' (retrying)';
    }
    if (tailCtl !== ctl) return;
    await new Promise(r => setTimeout(r, 3000));
  }
}

// Histogram of the current filters, stacked by severity (errors at the bottom), host or app.
// Clicking a host or app in the legend filters on it.
// Filters of the last search, so the chart keeps matching the table even if the inputs are
// edited without searching. The time window slides with the clock (used by live refresh).
let snap = null;
const SNAP_KEYS = ['q', 'host', 'app', 'level', 'f', 're', 'tag'];
function takeSnapshot() {
  snap = { range: $('range').value };
  if (snap.range === 'custom' && zoomWindow) Object.assign(snap, zoomWindow);
  for (const k of SNAP_KEYS) snap[k] = $(k).value.trim();
}
// A relative range slides with the clock; a zoomed window is fixed.
function applyWindow(p, s) {
  if (s.range === 'custom') { p.set('since', String(s.since)); p.set('until', String(s.until)); }
  else if (s.range) p.set('since', String(Date.now() - Number(s.range)));
}
function chartParams() {
  const p = new URLSearchParams();
  for (const k of SNAP_KEYS) if (snap[k]) p.set(k, snap[k]);
  applyWindow(p, snap);
  return p;
}

// Clicking a histogram bar zooms to that bucket: it becomes a fixed window, offered as an extra
// entry in the range selector (choose another range to leave it). Live is switched off.
let zoomWindow = null;
const MIN_ZOOM_MS = 10000;
function setZoomWindow(since, until) {
  zoomWindow = { since, until };
  let opt = $('range-custom');
  if (!opt) { opt = document.createElement('option'); opt.id = 'range-custom'; opt.value = 'custom'; $('range').append(opt); }
  opt.textContent = new Date(since).toLocaleString() + ' → ' + new Date(until).toLocaleString();
  $('range').value = 'custom';
}
function zoomTo(since, until) {
  setZoomWindow(since, until);
  $('live').checked = false;
  load();
}
function leaveZoom() {
  zoomWindow = null;
  const opt = $('range-custom');
  if (opt) opt.remove();
}
try { $('group').value = localStorage.getItem('logpit-group') || 'severity'; } catch {}

function colorFor(group, key, i) {
  if (group === 'severity') return null; // styled through the s0..s7 classes
  return key === 'other' ? 'var(--other)' : 'var(--c' + (i % 10) + ')';
}

// Dragging across the histogram zooms to the buckets covered by the selection. `chartGeo` keeps the
// buckets of the last render; `drag` is set while the pointer is down (refreshes are paused then).
let chartGeo = null, drag = null, dragged = false;
function dragRange(a, b) {
  const n = chartGeo.buckets.length;
  const rect = $('chart').getBoundingClientRect();
  const idx = x => Math.min(n - 1, Math.max(0, Math.floor((x - rect.left) / rect.width * n)));

async function loadChart() {

  const chart = $('chart'), bar = $('chartbar'), group = $('group').value;
  const p = chartParams();
  p.set('group_by', group);

  try {
    const res = await fetch('/api/stats?' + p, { headers: authHeaders() });
    if (!res.ok) { hide(); return; }
    const d = await res.json();
    // Stacking order: severities from most to least severe, otherwise largest group first.
    const keys = group === 'severity' ? LEVELS.filter(k => d.keys.includes(k)) : d.keys;
    const totals = Object.fromEntries(keys.map(k => [k, 0]));
    const max = Math.max(1, ...d.buckets.map(b => b.total));
    const NS = 'http://www.w3.org/2000/svg';

    d.buckets.forEach((b, i) => {
      let y = 100;
      const parts = [];

        parts.push((k || '(none)') + ' ' + n);

// Hour graduation under the chart, in the stream's time zone so it lines up with the hour bands.
// Over a long window the hours thin out to every few hours, then to days.
function drawAxis(d) {
  const n = d.buckets.length, marks = [];
  let prev = null;
  d.buckets.forEach((b, i) => {
    const { d: t, utc, h, key } = hourOf(b.ts);
    if (prev !== null && key !== prev) marks.push({ i, h, day: utc ? t.getUTCDate() : t.getDate(), t, utc });
    prev = key;
  });
  // As many labels as fit (about 56px each), none hugging the right edge.
  const room = Math.max(2, Math.floor($('chart').getBoundingClientRect().width / 56));
  const days = marks.length / 12 > room;
  let list = (days ? marks.filter(m => m.h === 0) : marks).filter(m => m.i / n < 0.95);
  const step = (days ? [1, 2, 7] : [1, 2, 3, 6, 12, 24]).find(s => list.length / s <= room) || 14;
  list = days ? list.filter((m, k) => k % step === 0) : list.filter(m => m.h % step === 0);
  $('axis').replaceChildren(...list.map(m => {
    const s = document.createElement('span');
    s.style.left = (100 * m.i / n) + '%';
    s.textContent = days ? m.t.toLocaleDateString([], { weekday: 'short', day: 'numeric', ...(m.utc ? { timeZone: 'UTC' } : {}) })
      : String(m.h).padStart(2, '0') + ':00';
    return s;
  }));
  $('axis').hidden = false;
}

// Download the entries of the last search (its filters and time window) through /api/export.
// The browser cannot stream a download that needs an Authorization header, so the file is
// collected in memory first; hence the cap. Use the API directly for larger exports.
const EXPORT_LIMIT = 100000;
async function exportLogs(format) {
  if (!snap) return;
  const buttons = [$('expNdjson'), $('expCsv')];
  const p = new URLSearchParams();
  for (const k of SNAP_KEYS) if (snap[k]) p.set(k, snap[k]);
  applyWindow(p, snap);
  p.set('format', format);
  p.set('limit', String(EXPORT_LIMIT));
  buttons.forEach(b => b.disabled = true);
  $('status').textContent = 'exporting…';
  try {
    const res = await fetch('/api/export?' + p, { headers: authHeaders() });
    if (!res.ok) throw new Error((await res.text()).slice(0, 120) || 'HTTP ' + res.status);
    const blob = await res.blob();

    a.href = URL.createObjectURL(blob);
    a.download = 'logpit-export.' + (format === 'csv' ? 'csv' : 'ndjson');
    document.body.append(a);
    a.click();

    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    $('status').textContent = 'exported ' + (blob.size / 1e6).toFixed(1) + ' MB (up to ' + EXPORT_LIMIT.toLocaleString() + ' entries)';
  } catch (e) {

function trendOf(prev, recent) {
  if (prev === 0) return recent > 0 ? { cls: 'new', text: 'new' } : { cls: 'flat', text: '' };
  const pct = Math.round(100 * (recent - prev) / prev);
  if (Math.abs(recent - prev) < 3 || Math.abs(pct) < 25) return { cls: 'flat', text: (pct > 0 ? '+' : '') + pct + '%' };
  return pct > 0 ? { cls: 'up', text: '+' + pct + '%' } : { cls: 'down', text: '−' + -pct + '%' };
}

// Per-host summary of the current filters (all hosts, even when one is selected).
function ago(ms) {
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

} catch {}

  hostSort = hostSort.key === key ? { key, dir: -hostSort.dir } : { key, dir: key === 'host' ? 1 : -1 };

// The last search is mirrored in the URL (never the token), so a link restores the same view:
// filters, time range or zoomed window, and the chart grouping. Each new search is a history

const DEFAULT_RANGE = '3600000';

  if (snap.range === 'custom') { p.set('since', String(snap.since)); p.set('until', String(snap.until)); }
  else if (snap.range === '') p.set('range', 'all');
  else if (snap.range !== DEFAULT_RANGE) p.set('range', snap.range);
  if ($('group').value !== 'severity') p.set('group', $('group').value);
  return p.toString();
}
function syncUrl(forceReplace) {

  // The tag list arrives asynchronously, so a tag from the address must still be selectable.
  const wantedTag = p.get('tag') || '';
  if (wantedTag && ![...$('tag').options].some(o => o.value === wantedTag)) {
    const o = document.createElement('option');
    o.value = o.textContent = wantedTag;
    $('tag').append(o);
  }
  for (const k of SNAP_KEYS) $(k).value = p.get(k) || '';
  const since = Number(p.get('since')), until = Number(p.get('until'));
  if (p.has('since') && p.has('until') && Number.isFinite(since) && Number.isFinite(until) && since <= until) {
    setZoomWindow(since, until);
  } else {
    leaveZoom();
    const r = p.get('range');
    $('range').value = r === 'all' ? '' : [...$('range').options].some(o => o.value === r) ? r : DEFAULT_RANGE;
  }
  const g = p.get('group');
  if (['severity', 'host', 'app'].includes(g)) $('group').value = g;
}
window.addEventListener('popstate', () => { applyUrl(); suppressPush = true; load(); });

// Saved views: a named search kept on the server (the same query string the address bar holds),
// so a team shares its useful searches. Selecting one opens it; saving under an existing name
// replaces that view.
let savedViews = [];
function currentQuery() { return snap ? snapQuery() : location.search.replace(/^\?/, ''); }

// Two queries mean the same search when they agree after dropping empty values and the default
// range and ordering the keys (a saved view may list its parameters in any order).
function canonQuery(q) {
  const p = new URLSearchParams(q);
  if (p.get('range') === DEFAULT_RANGE) p.delete('range');
  for (const [k, v] of [...p]) if (v === '') p.delete(k);
  p.sort();
  return p.toString();
}

function markCurrentView() {
  const q = canonQuery(currentQuery());
  const match = savedViews.find(v => canonQuery(v.query) === q);
  $('views').value = match ? String(match.id) : '';
  $('delView').hidden = !match;
}

async function loadViews() {
  try {
    const res = await fetch('/api/views', { headers: authHeaders() });
    if (!res.ok) { $('views').hidden = $('saveView').hidden = true; return; }
    savedViews = await res.json();
    $('views').hidden = $('saveView').hidden = false;
    const placeholder = document.createElement('option');
    placeholder.value = ''; placeholder.textContent = savedViews.length ? 'Views' : 'No saved views';
    $('views').replaceChildren(placeholder, ...savedViews.map(v => {
      const o = document.createElement('option');
      o.value = String(v.id); o.textContent = v.name;
      return o;
    }));
    markCurrentView();
  } catch { $('views').hidden = $('saveView').hidden = true; }
}

$('views').onchange = () => {
  const v = savedViews.find(x => String(x.id) === $('views').value);
  if (!v) return;
  history.pushState(null, '', v.query ? '?' + v.query : location.pathname);
  applyUrl();
  load();
};

$('saveView').onclick = async () => {
  const match = savedViews.find(v => String(v.id) === $('views').value);
  const name = prompt('Name for this view (an existing name is replaced):', match ? match.name : '');
  if (name === null || !name.trim()) return;
  try {
    const res = await fetch('/api/views', {
      method: 'POST',
      headers: { ...authHeaders(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, query: currentQuery() }),
    });
    if (!res.ok) throw new Error((await res.text()).slice(0, 160) || 'HTTP ' + res.status);
    const saved = await res.json();
    await loadViews();
    $('views').value = String(saved.id);
    $('delView').hidden = false;
    $('status').textContent = 'view "' + saved.name + '" saved';
  } catch (e) { $('status').textContent = 'could not save the view: ' + String(e.message || e); }
};

$('delView').onclick = async () => {
  const v = savedViews.find(x => String(x.id) === $('views').value);
  if (!v || !confirm('Delete the view "' + v.name + '"?')) return;
  try {
    const res = await fetch('/api/views/' + v.id, { method: 'DELETE', headers: authHeaders() });
    if (!res.ok && res.status !== 404) throw new Error((await res.text()).slice(0, 160) || 'HTTP ' + res.status);
    await loadViews();
    $('status').textContent = 'view "' + v.name + '" deleted';
  } catch (e) { $('status').textContent = 'could not delete the view: ' + String(e.message || e); }
};


$('group').onchange = () => {
  try { localStorage.setItem('logpit-group', $('group').value); } catch {}
  if (snap) syncUrl(true);
  loadChart();
};

// Paging: the server returns `X-Next-Cursor` when a page is full; "Load more" appends the next one.
let nextCursor = null, pageParams = null;
const PAGE_SIZE = 500;

async function loadMore() {
  if (!nextCursor || !pageParams) return;
  const p = new URLSearchParams(pageParams);
  p.set('before', nextCursor);
  $('more').disabled = true;
  try {
    const res = await fetch('/api/logs?' + p, { headers: authHeaders() });
    if (!res.ok) throw new Error((await res.text()).slice(0, 120) || 'HTTP ' + res.status);
    addRows(await res.json(), true);
    nextCursor = res.headers.get('X-Next-Cursor');
    $('morebar').hidden = !nextCursor;
    $('status').textContent = entries + ' entries' + (nextCursor ? ' (more available)' : '');
  } catch (e) { $('status').textContent = String(e.message || e); }
  finally { $('more').disabled = false; }
}
$('more').onclick = loadMore;

async function load() {
  stopTail();
  takeSnapshot();
  nextCursor = null;
  $('morebar').hidden = true;
  if (snap.range === 'custom') $('live').checked = false;
  syncUrl();
  markFilters();
  const p = new URLSearchParams({ limit: String(PAGE_SIZE) });
  for (const k of SNAP_KEYS) if ($(k).value.trim()) p.set(k, $(k).value.trim());
  applyWindow(p, snap);
  const headers = authHeaders();
  const token = $('token').value;
  if (token) { try { localStorage.setItem('logpit-token', token); } catch {} }
  try {
    const res = await fetch('/api/logs?' + p, { headers });
    if (res.status === 401) {
      addRows([], false);
      $('empty').textContent = token ? 'Invalid token. Check the Token field above.' : 'This LogPit requires a token. Enter it in the Token field above, then press Search.';
      $('empty').hidden = false;
      $('status').textContent = 'unauthorized';
      showFilters(true);
      $('token').focus();
      return;
    }
    if (res.status === 403) {
      addRows([], false);
      $('empty').textContent = 'This token is not allowed to read logs (it has no read scope). Enter a token with read access.';
      $('empty').hidden = false;
      $('status').textContent = 'forbidden';
      showFilters(true);
      $('token').focus();
      return;
    }
    if (!res.ok) throw new Error((await res.text()).slice(0, 120) || 'HTTP ' + res.status);
    const rows = await res.json();
    addRows(rows, false);
    $('empty').textContent = 'No matching entries.';
    $('empty').hidden = rows.length > 0;
    pageParams = p.toString();
    nextCursor = res.headers.get('X-Next-Cursor');
    $('morebar').hidden = !nextCursor;
    $('status').textContent = rows.length + ' entries' + (nextCursor ? ' (more available)' : '');
    loadChart();
    loadHosts();
    loadTop();
    loadPatterns();
    loadAlerts();
    loadViews();
    if ($('live').checked) startTail();
  } catch (e) { $('status').textContent = String(e.message || e); }
}

$('go').onclick = load;
$('token').addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
for (const id of ['q', 'host', 'app', 'f', 're']) $(id).addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
$('level').onchange = load;
$('tag').onchange = load;
// Host tags from the configuration: the selector only appears when some are defined.
async function loadTagOptions() {
  try {
    const res = await fetch('/api/tags', { headers: authHeaders() });
    if (!res.ok) return;
    const names = (await res.json()).map(t => t.name);
    const current = $('tag').value;
    const first = $('tag').options[0];
    $('tag').replaceChildren(first, ...names.map(n => {
      const o = document.createElement('option');
      o.value = o.textContent = n;
      return o;
    }));
    if (current && !names.includes(current)) {
      const o = document.createElement('option');
      o.value = o.textContent = current;
      $('tag').append(o);
    }
    $('tag').value = current;
    $('tag').hidden = names.length === 0 && !current;
  } catch {}
}
$('range').onchange = () => { if ($('range').value !== 'custom') leaveZoom(); load(); };

// On phones the secondary filters fold behind a toggle that counts the active ones.
function showFilters(open) {
  document.querySelector('header').classList.toggle('filters-open', open);
  $('filtersToggle').setAttribute('aria-expanded', String(open));
}
// The skip link focuses the results without a fragment navigation (which would fire popstate and reload).
document.querySelector('.skip').onclick = e => { e.preventDefault(); $('stream').focus(); };
$('filtersToggle').onclick = () => showFilters(!document.querySelector('header').classList.contains('filters-open'));
function markFilters() {
  const n = ['host', 'app', 'tag', 'f', 're'].filter(k => $(k).value.trim()).length;
  $('filterCount').textContent = n ? ' · ' + n : '';
}

// The sticky header's height, so the rail and the hour bands stick right under it (none on phones,
// where the header scrolls away).
(function () {
  const header = document.querySelector('header');
  const set = () => document.documentElement.style.setProperty('--hdr',
    (getComputedStyle(header).position === 'sticky' ? header.offsetHeight : 0) + 'px');
  new ResizeObserver(set).observe(header);
  window.addEventListener('resize', set);
})();
$('live').onchange = () => { if ($('live').checked) load(); else { stopTail(); load(); } };
syncPrefControls();
applyUrl();
loadTagOptions();
suppressPush = true; // the first load canonicalizes the URL instead of adding an entry
load();
</script>
</body>
</html>
