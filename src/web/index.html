<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogPit</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1b1f24; --muted:#6a737d; --line:#d8dee4; --accent:#0969da; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#58a6ff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line); align-items:center; position:sticky; top:0; background:var(--bg); }
  h1 { font-size:16px; margin:0 8px 0 0; }
  input, select, button { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  input[type=search] { flex:1 1 240px; min-width:160px; }
  button { cursor:pointer; background:var(--accent); color:#fff; border-color:var(--accent); }
  label { color:var(--muted); display:flex; align-items:center; gap:4px; }
  #status { color:var(--muted); margin-left:auto; }
  table { width:100%; border-collapse:collapse; font:12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  td { padding:3px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  td.ts, td.host, td.app { white-space:nowrap; color:var(--muted); }
  td.msg { white-space:pre-wrap; word-break:break-word; width:100%; }
  td.ts.ctxable { cursor:pointer; } td.ts.ctxable:hover { color:var(--accent); text-decoration:underline dotted; }
  tr.ctx > td { padding:6px 10px 10px 28px; background:color-mix(in srgb, var(--accent) 6%, transparent); }
  .ctxhead { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; margin-bottom:4px; color:var(--muted); font:12px system-ui, sans-serif; }
  .ctxhead button { padding:1px 8px; font-size:11px; }
  .ctxline { display:grid; grid-template-columns:auto 4.5em 8em 1fr; gap:0 10px; padding:1px 0; }
  .ctxline > span:first-child, .ctxline .app { color:var(--muted); white-space:nowrap; }
  .ctxline .m { white-space:pre-wrap; word-break:break-word; }
  .ctxline.cur { background:color-mix(in srgb, var(--accent) 18%, transparent); font-weight:600; }
  .ctxline.other .m { opacity:.85; }
  .sev { font-weight:600; }
  .fields { margin-top:2px; display:flex; flex-wrap:wrap; gap:2px 8px; color:var(--muted); font-size:11.5px; }
  .fields span { cursor:pointer; } .fields span:hover { color:var(--accent); }
  .fields b { font-weight:600; }
  .s0,.s1,.s2,.s3 { color:#d1242f; } .s4 { color:#bf8700; } .s5 { color:#0969da; } .s6 { color:var(--muted); } .s7 { color:var(--muted); opacity:.7; }
  :root { --c0:#4e79a7; --c1:#f28e2b; --c2:#59a14f; --c3:#b07aa1; --c4:#76b7b2; --c5:#edc948; --c6:#ff9da7; --c7:#9c755f; --c8:#af7aa1; --c9:#86bc86; --other:#8b949e; }
  #chartbar { display:flex; flex-wrap:wrap; align-items:center; gap:4px 14px; padding:6px 16px; font-size:12px; color:var(--muted); }
  #chartbar .exp { margin-left:auto; display:flex; align-items:center; gap:6px; }
  #chartbar .exp button { padding:1px 8px; font-size:11px; }
  #chartbar select { padding:2px 6px; font-size:12px; }
  #legend { display:flex; flex-wrap:wrap; gap:2px 12px; }
  .lg { display:inline-flex; align-items:center; gap:5px; }
  .lg[data-key] { cursor:pointer; } .lg[data-key]:hover { color:var(--accent); }
  .lg i { width:10px; height:10px; border-radius:2px; background:currentColor; display:inline-block; }
  .lg b { font-weight:600; color:var(--fg); }
  #chart { display:block; width:100%; height:64px; border-bottom:1px solid var(--line); }
  #chart rect { fill:currentColor; }
  #chart .hit { fill:transparent; cursor:zoom-in; } #chart .hit:hover { fill:var(--accent); fill-opacity:.15; }
  #chart .hit.flat { cursor:default; }
  #chart { touch-action:pan-y; user-select:none; }
  #chart .sel { fill:var(--accent); fill-opacity:.3; stroke:var(--accent); stroke-width:1; vector-effect:non-scaling-stroke; pointer-events:none; }
  #top { border-bottom:1px solid var(--line); padding:0 16px; font-size:12px; }
  #top summary { cursor:pointer; padding:6px 0; color:var(--muted); }
  #top .topctl { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; margin-bottom:6px; color:var(--muted); }
  #top select { padding:2px 6px; font-size:12px; }
  .toprow { display:grid; grid-template-columns:minmax(8em, 22em) minmax(80px, 1fr) 11em; gap:0 10px; align-items:center; padding:1px 0; max-width:60em; }
  .toprow .v { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; cursor:pointer; }
  .toprow .v:hover { color:var(--accent); }
  .toprow .bar { height:10px; background:color-mix(in srgb, var(--accent) 55%, transparent); border-radius:2px; min-width:1px; }
  .toprow .n { text-align:right; color:var(--muted); } .toprow .n b { color:var(--fg); font-weight:600; }
  #patterns { border-bottom:1px solid var(--line); padding:0 16px; font-size:12px; }
  #patterns summary { cursor:pointer; padding:6px 0; color:var(--muted); }
  .patrow { display:grid; grid-template-columns:5.5em 6.5em minmax(10em, 1fr) 15em; gap:0 10px; align-items:baseline; padding:2px 0; }
  .patrow .n { text-align:right; font-weight:600; }
  .patrow .p { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .patrow .p.link { cursor:pointer; } .patrow .p.link:hover { color:var(--accent); }
  .patrow .m { color:var(--muted); text-align:right; white-space:nowrap; }
  .patrow .t { white-space:nowrap; } .t.up { color:#cf222e; } .t.down { color:#1a7f37; } .t.flat { color:var(--muted); }
  #patList:empty::after { content:'No entries in the current results.'; color:var(--muted); }
  #topList:empty::after { content:'No values for this field in the current results.'; color:var(--muted); }
  #hosts { border-bottom:1px solid var(--line); padding:0 16px; font-size:12px; }
  #hosts summary { cursor:pointer; padding:6px 0; color:var(--muted); }
  #hostsTable { width:auto; min-width:min(100%, 520px); margin:0 0 8px; }
  #hostsTable th { text-align:left; font-weight:600; color:var(--muted); padding:2px 14px 2px 0; border-bottom:1px solid var(--line); }
  #hostsTable th[data-sort] { cursor:pointer; user-select:none; } #hostsTable th[data-sort]:hover { color:var(--accent); }
  #hostsTable th[aria-sort]::after { content:' \25B2'; font-size:9px; } #hostsTable th[aria-sort=descending]::after { content:' \25BC'; }
  #hostsTable th.n, #hostsTable td.n { text-align:right; }
  #hostsTable td { padding:2px 14px 2px 0; border-bottom:1px solid var(--line); white-space:nowrap; }
  #hostsTable td.name { cursor:pointer; } #hostsTable td.name:hover { color:var(--accent); }
  #hostsTable tr.active td.name { font-weight:700; }
  #hostsTable td.zero { color:var(--muted); opacity:.6; }
  .badge { background:#d1242f; color:#fff; border-radius:4px; padding:0 5px; margin-left:6px; font:600 11px system-ui, sans-serif; }
  #morebar { text-align:center; padding:12px; }
  #empty { padding:24px 16px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>LogPit</h1>
  <input id="q" type="search" placeholder="Search messages…" autofocus title="Words must all match. Use OR between alternatives, -word or NOT word to exclude, &quot;a phrase&quot; for adjacent words, and prefix* for prefixes. Example: disk error OR timeout -debug">
  <input id="host" type="search" placeholder="Host" size="12">
  <input id="app" type="search" placeholder="App" size="12">
  <select id="tag" hidden title="Only the hosts that have this tag (see [[tags]] in the configuration)"><option value="">All tags</option></select>
  <input id="f" type="search" placeholder="field:value" size="14" title="Filter on a structured field: act:blocked (exact), status>=500 (also &gt;, &lt;, &lt;=, numbers only), act!=block, src~^10\. (regular expression). The field must be present.">
  <input id="re" type="search" placeholder="Regex on message" size="14" title="Keep messages matching a regular expression, e.g. timeout|refused or (?i)error [0-9]+. It scans the entries left by the other filters, so narrow the time range first.">
  <select id="level" title="Minimum severity">
    <option value="">All levels</option>
    <option value="3">Error and above</option>
    <option value="4">Warning and above</option>
    <option value="6">Info and above</option>
  </select>
  <select id="range" title="Time range">
    <option value="900000">Last 15 min</option>
    <option value="3600000" selected>Last hour</option>
    <option value="86400000">Last 24 h</option>
    <option value="604800000">Last 7 days</option>
    <option value="">All time</option>
  </select>
  <input id="token" type="password" placeholder="Token (if set)" size="12" autocomplete="off">
  <label title="Stream new entries as they arrive"><input id="live" type="checkbox"> Live</label>
  <button id="go">Search</button>
  <select id="views" title="Saved views, shared by everyone who uses this LogPit"><option value="">Views</option></select>
  <button id="saveView" type="button" title="Save the current search, time range and chart grouping under a name">Save view</button>
  <button id="delView" type="button" title="Delete the selected view" hidden>Delete</button>
  <span id="status"></span>
</header>
<div id="chartbar" hidden>
  <label>Stack by
    <select id="group"><option value="severity">severity</option><option value="host">host</option><option value="app">app</option></select>
  </label>
  <div id="legend"></div>
  <span class="exp">Export
    <button id="expNdjson" type="button" title="Download the matching entries as NDJSON (up to 100,000)">NDJSON</button>
    <button id="expCsv" type="button" title="Download the matching entries as CSV (up to 100,000)">CSV</button>
  </span>
</div>
<svg id="chart" viewBox="0 0 1 1" preserveAspectRatio="none" hidden></svg>
<details id="hosts">
  <summary>Hosts <span id="hostsCount"></span></summary>
  <table id="hostsTable">
    <thead><tr><th data-sort="host">Host</th><th>Tags</th><th class="n" data-sort="count">Entries</th><th class="n" data-sort="errors">Errors</th><th class="n" data-sort="warnings">Warnings</th><th data-sort="last_ts">Last seen</th></tr></thead>
    <tbody id="hostsBody"></tbody>
  </table>
</details>
<details id="top">
  <summary>Top values <span id="topMeta"></span></summary>
  <div class="topctl"><label>Field <select id="topField"></select></label><span id="topNote"></span></div>
  <div id="topList"></div>
</details>
<details id="patterns">
  <summary>Message patterns <span id="patMeta"></span></summary>
  <div id="patNote" style="color:var(--muted); margin-bottom:4px;"></div>
  <div id="patList"></div>
</details>
<table><tbody id="rows"></tbody></table>
<div id="morebar" hidden><button id="more" type="button">Load more</button></div>
<div id="empty" hidden></div>
<script>
const $ = id => document.getElementById(id);
const LEVELS = ['emerg','alert','crit','err','warn','notice','info','debug'];
try { $('token').value = localStorage.getItem('logpit-token') || ''; } catch {}

// Log lines in the table; expanded context panels are rows too, but not entries.
function entryCount() { return $('rows').querySelectorAll('tr:not(.ctx)').length; }

function td(cls, text) { const c = document.createElement('td'); c.className = cls; c.textContent = text; return c; }

// Message cell: the message plus its structured fields (click a field to filter on it).
function msgCell(r) {
  const c = td('msg', r.message);
  const keys = Object.keys(r.fields || {}).filter(k => !k.startsWith('cef_') && k !== 'msg');
  if (keys.length) {
    const box = document.createElement('div');
    box.className = 'fields';
    for (const k of keys) {
      const s = document.createElement('span');
      const b = document.createElement('b');
      b.textContent = k + '=';
      s.append(b, document.createTextNode(r.fields[k]));
      s.title = 'Filter on ' + k + ':' + r.fields[k];
      s.onclick = () => { $('f').value = k + ':' + r.fields[k]; load(); };
      box.append(s);
    }
    c.append(box);
  }
  return c;
}

// Clicking a timestamp shows the entries around that line (the same host by default).
// Entries that arrived through the live stream have no id yet, so they cannot be expanded.
const CONTEXT_STEP = 10;
function ctxTime(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString([], { hour12: false }) + '.' + String(d.getMilliseconds()).padStart(3, '0');
}

async function fillContext(box, row, opts) {
  box.replaceChildren(document.createTextNode('Loading…'));
  try {
    const q = new URLSearchParams({ lines: String(opts.lines), scope: opts.scope });
    const res = await fetch('/api/logs/' + row.id + '/context?' + q, { headers: authHeaders() });
    if (res.status === 404) { box.textContent = 'This entry is no longer stored.'; return; }
    if (!res.ok) throw new Error((await res.text()).slice(0, 120) || 'HTTP ' + res.status);
    const d = await res.json();

    const head = document.createElement('div');
    head.className = 'ctxhead';
    const title = document.createElement('span');
    title.textContent = 'Around this entry, oldest first (' + (opts.scope === 'host' ? 'host ' + row.host : 'all hosts') + ')';
    const more = document.createElement('button');
    more.type = 'button'; more.textContent = '+' + CONTEXT_STEP + ' lines';
    more.disabled = opts.lines >= 100;
    more.onclick = () => fillContext(box, row, { ...opts, lines: Math.min(100, opts.lines + CONTEXT_STEP) });
    const scope = document.createElement('button');
    scope.type = 'button'; scope.textContent = opts.scope === 'host' ? 'all hosts' : 'this host only';
    scope.onclick = () => fillContext(box, row, { ...opts, scope: opts.scope === 'host' ? 'all' : 'host' });
    const close = document.createElement('button');
    close.type = 'button'; close.textContent = 'close';
    close.onclick = () => box.closest('tr').remove();
    head.append(title, more, scope, close);

    const line = (r, cur) => {
      const el = document.createElement('div');
      el.className = 'ctxline ' + (cur ? 'cur' : r.host === row.host ? '' : 'other');
      const t = document.createElement('span'); t.textContent = ctxTime(r.ts);
      const sev = document.createElement('span'); sev.className = 'sev s' + r.severity; sev.textContent = LEVELS[r.severity] || r.severity;
      const app = document.createElement('span'); app.className = 'app'; app.textContent = (opts.scope === 'all' ? r.host + ' ' : '') + r.app;
      const m = document.createElement('span'); m.className = 'm'; m.textContent = r.message;
      el.append(t, sev, app, m);
      return el;
    };
    box.replaceChildren(head, ...d.before.map(r => line(r, false)), line(d.entry, true), ...d.after.map(r => line(r, false)));
  } catch (e) { box.textContent = 'Could not load the context: ' + String(e.message || e); }
}

function toggleContext(tr, row) {
  const next = tr.nextElementSibling;
  if (next && next.classList.contains('ctx')) { next.remove(); return; }
  const ctx = document.createElement('tr');
  ctx.className = 'ctx';
  const cell = document.createElement('td');
  cell.colSpan = 5;
  ctx.append(cell);
  tr.after(ctx);
  fillContext(cell, row, { lines: 5, scope: 'host' });
}

function rowEl(r) {
  const tr = document.createElement('tr');
  const ts = td('ts', new Date(r.ts).toLocaleString());
  if (r.id !== undefined) {
    ts.classList.add('ctxable');
    ts.title = 'Show the entries around this one';
    ts.onclick = () => toggleContext(tr, r);
  }
  tr.append(
    ts,
    td('sev s' + r.severity, LEVELS[r.severity] || r.severity),
    td('host', r.host), td('app', r.app), msgCell(r));
  return tr;
}

function authHeaders() {
  const token = $('token').value;
  return token ? { Authorization: 'Bearer ' + token } : {};
}

// Live tail: SSE over fetch (EventSource cannot send the Authorization header).
let tailCtl = null;
const MAX_LIVE_ROWS = 1000;

let chartTimer = null, chartBusy = false;
const CHART_REFRESH_MS = 5000;

function stopTail() {
  if (tailCtl) tailCtl.abort();
  tailCtl = null;
  clearInterval(chartTimer);
  chartTimer = null;
}

// While live, redraw the histogram periodically so it follows the stream.
async function refreshChart() {
  if (document.hidden || chartBusy) return;
  chartBusy = true;
  try { await Promise.all([loadChart(), loadHosts(), loadTop(), loadPatterns()]); } finally { chartBusy = false; }
}

function handleEvent(raw) {
  let name = 'message', data = '';
  for (const line of raw.split('\n')) {
    if (line.startsWith('event:')) name = line.slice(6).trim();
    else if (line.startsWith('data:')) data += line.slice(5).trimStart();
  }
  if (name === 'lagged') { $('status').textContent = 'live: skipped ' + data + ' entries'; return; }
  if (!data) return;
  const body = $('rows');
  body.prepend(rowEl(JSON.parse(data)));
  while (entryCount() > MAX_LIVE_ROWS) body.lastElementChild.remove();
  $('empty').hidden = true;
  $('status').textContent = 'live · ' + entryCount() + ' entries';
}

async function startTail() {
  stopTail();
  const ctl = tailCtl = new AbortController();
  chartTimer = setInterval(refreshChart, CHART_REFRESH_MS);
  const p = new URLSearchParams();
  for (const k of SNAP_KEYS) if (snap[k]) p.set(k, snap[k]);
  while (tailCtl === ctl) {
    try {
      const res = await fetch('/api/tail?' + p, { headers: authHeaders(), signal: ctl.signal });
      if (!res.ok) throw new Error((await res.text()).slice(0, 120) || 'HTTP ' + res.status);
      $('status').textContent = 'live';
      const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
      let buf = '';
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += value.replace(/\r\n/g, '\n');
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) { handleEvent(buf.slice(0, i)); buf = buf.slice(i + 2); }
      }
    } catch (e) {
      if (ctl.signal.aborted) return;
      $('status').textContent = 'live: ' + String(e.message || e) + ' (retrying)';
    }
    if (tailCtl !== ctl) return;
    await new Promise(r => setTimeout(r, 3000));
  }
}

// Histogram of the current filters, stacked by severity (errors at the bottom), host or app.
// Clicking a host or app in the legend filters on it.
// Filters of the last search, so the chart keeps matching the table even if the inputs are
// edited without searching. The time window slides with the clock (used by live refresh).
let snap = null;
const SNAP_KEYS = ['q', 'host', 'app', 'level', 'f', 're', 'tag'];
function takeSnapshot() {
  snap = { range: $('range').value };
  if (snap.range === 'custom' && zoomWindow) Object.assign(snap, zoomWindow);
  for (const k of SNAP_KEYS) snap[k] = $(k).value.trim();
}
// A relative range slides with the clock; a zoomed window is fixed.
function applyWindow(p, s) {
  if (s.range === 'custom') { p.set('since', String(s.since)); p.set('until', String(s.until)); }
  else if (s.range) p.set('since', String(Date.now() - Number(s.range)));
}
function chartParams() {
  const p = new URLSearchParams();
  for (const k of SNAP_KEYS) if (snap[k]) p.set(k, snap[k]);
  applyWindow(p, snap);
  return p;
}

// Clicking a histogram bar zooms to that bucket: it becomes a fixed window, offered as an extra
// entry in the range selector (choose another range to leave it). Live is switched off.
let zoomWindow = null;
const MIN_ZOOM_MS = 10000;
function setZoomWindow(since, until) {
  zoomWindow = { since, until };
  let opt = $('range-custom');
  if (!opt) { opt = document.createElement('option'); opt.id = 'range-custom'; opt.value = 'custom'; $('range').append(opt); }
  opt.textContent = new Date(since).toLocaleString() + ' → ' + new Date(until).toLocaleString();
  $('range').value = 'custom';
}
function zoomTo(since, until) {
  setZoomWindow(since, until);
  $('live').checked = false;
  load();
}
function leaveZoom() {
  zoomWindow = null;
  const opt = $('range-custom');
  if (opt) opt.remove();
}
try { $('group').value = localStorage.getItem('logpit-group') || 'severity'; } catch {}

function colorFor(group, key, i) {
  if (group === 'severity') return null; // styled through the s0..s7 classes
  return key === 'other' ? 'var(--other)' : 'var(--c' + (i % 10) + ')';
}

// Dragging across the histogram zooms to the buckets covered by the selection. `chartGeo` keeps the
// buckets of the last render; `drag` is set while the pointer is down (refreshes are paused then).
let chartGeo = null, drag = null, dragged = false;
function dragRange(a, b) {
  const n = chartGeo.buckets.length;
  const rect = $('chart').getBoundingClientRect();
  const idx = x => Math.min(n - 1, Math.max(0, Math.floor((x - rect.left) / rect.width * n)));
  const i0 = idx(Math.min(a, b)), i1 = idx(Math.max(a, b));
  return { i0, i1, since: chartGeo.buckets[i0].ts, until: chartGeo.buckets[i1].ts + chartGeo.bucket_ms - 1 };
}
function drawSelection(r) {
  let el = $('chart').querySelector('.sel');
  if (!r) { if (el) el.remove(); return; }
  if (!el) { el = document.createElementNS('http://www.w3.org/2000/svg', 'rect'); el.setAttribute('class', 'sel'); el.setAttribute('y', 0); el.setAttribute('height', 100); $('chart').append(el); }
  el.setAttribute('x', r.i0); el.setAttribute('width', r.i1 - r.i0 + 1);
}
(function () {
  const chart = $('chart');
  chart.addEventListener('pointerdown', e => {
    if (e.button !== 0 || !chartGeo || !chartGeo.buckets.length) return;
    drag = { x: e.clientX }; dragged = false;
  });
  chart.addEventListener('pointermove', e => {
    if (!drag) return;
    // Capture only once it is a drag, so a plain click still reaches the bucket under it.
    if (!dragged && Math.abs(e.clientX - drag.x) > 4) { dragged = true; chart.setPointerCapture(e.pointerId); }
    if (dragged) drawSelection(dragRange(drag.x, e.clientX));
  });
  const end = e => {
    if (!drag) return;
    const from = drag.x;
    drag = null;
    drawSelection(null);
    if (dragged && e.type === 'pointerup') {
      const r = dragRange(from, e.clientX);
      zoomTo(r.since, r.until);
    }
    setTimeout(() => { dragged = false; }, 0);
  };
  chart.addEventListener('pointerup', end);
  chart.addEventListener('pointercancel', end);
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && drag) { drag = null; dragged = false; drawSelection(null); } });
})();

async function loadChart() {
  if (!snap || drag) return;
  const chart = $('chart'), bar = $('chartbar'), group = $('group').value;
  const p = chartParams();
  p.set('group_by', group);
  const hide = () => { chart.hidden = true; bar.hidden = true; };
  try {
    const res = await fetch('/api/stats?' + p, { headers: authHeaders() });
    if (!res.ok) { hide(); return; }
    const d = await res.json();
    // Stacking order: severities from most to least severe, otherwise largest group first.
    const keys = group === 'severity' ? LEVELS.filter(k => d.keys.includes(k)) : d.keys;
    const totals = Object.fromEntries(keys.map(k => [k, 0]));
    const max = Math.max(1, ...d.buckets.map(b => b.total));
    const NS = 'http://www.w3.org/2000/svg';
    const style = (el, k, i) => {
      if (group === 'severity') el.setAttribute('class', 's' + LEVELS.indexOf(k));
      else el.style.color = colorFor(group, k, i);
    };
    const bars = [], hits = [];
    d.buckets.forEach((b, i) => {
      let y = 100;
      const parts = [];
      keys.forEach((k, ki) => {
        const n = (b.groups || {})[k];
        if (!n) return;
        totals[k] += n;
        const h = 100 * n / max;
        y -= h;
        const r = document.createElementNS(NS, 'rect');
        style(r, k, ki);
        r.setAttribute('x', i + 0.1); r.setAttribute('width', 0.8);
        r.setAttribute('y', y); r.setAttribute('height', h);
        bars.push(r);
        parts.push((k || '(none)') + ' ' + n);
      });
      const hit = document.createElementNS(NS, 'rect');
      hit.setAttribute('class', 'hit');
      hit.setAttribute('x', i); hit.setAttribute('width', 1);
      hit.setAttribute('y', 0); hit.setAttribute('height', 100);
      const zoomable = d.bucket_ms > MIN_ZOOM_MS;
      if (zoomable) hit.onclick = () => { if (!dragged) zoomTo(b.ts, b.ts + d.bucket_ms - 1); };
      else hit.classList.add('flat');
      const t = document.createElementNS(NS, 'title');
      t.textContent = new Date(b.ts).toLocaleString() + ' — ' + b.total +
        (parts.length ? ' (' + parts.join(', ') + ')' : '') + (zoomable ? ' · click to zoom, drag to select a range' : ' · drag to select a range');
      hit.append(t);
      hits.push(hit);
    });
    chartGeo = { bucket_ms: d.bucket_ms, buckets: d.buckets };
    chart.setAttribute('viewBox', '0 0 ' + Math.max(1, d.buckets.length) + ' 100');
    chart.replaceChildren(...bars, ...hits);
    chart.hidden = false;

    const items = keys.map((k, ki) => {
      const el = document.createElement('span');
      el.className = 'lg';
      const sw = document.createElement('i');
      style(sw, k, ki);
      const name = document.createElement('span');
      name.textContent = k || '(none)';
      const n = document.createElement('b');
      n.textContent = totals[k].toLocaleString();
      el.append(sw, name, n);
      if ((group === 'host' || group === 'app') && k && k !== 'other') {
        el.dataset.key = k;
        el.title = 'Filter on ' + group + ' ' + k;
        el.onclick = () => { $(group).value = k; load(); };
      }
      return el;
    });
    $('legend').replaceChildren(...items);
    bar.hidden = false;
  } catch { hide(); }
}

// Download the entries of the last search (its filters and time window) through /api/export.
// The browser cannot stream a download that needs an Authorization header, so the file is
// collected in memory first; hence the cap. Use the API directly for larger exports.
const EXPORT_LIMIT = 100000;
async function exportLogs(format) {
  if (!snap) return;
  const buttons = [$('expNdjson'), $('expCsv')];
  const p = new URLSearchParams();
  for (const k of SNAP_KEYS) if (snap[k]) p.set(k, snap[k]);
  applyWindow(p, snap);
  p.set('format', format);
  p.set('limit', String(EXPORT_LIMIT));
  buttons.forEach(b => b.disabled = true);
  $('status').textContent = 'exporting…';
  try {
    const res = await fetch('/api/export?' + p, { headers: authHeaders() });
    if (!res.ok) throw new Error((await res.text()).slice(0, 120) || 'HTTP ' + res.status);
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'logpit-export.' + (format === 'csv' ? 'csv' : 'ndjson');
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    $('status').textContent = 'exported ' + (blob.size / 1e6).toFixed(1) + ' MB (up to ' + EXPORT_LIMIT.toLocaleString() + ' entries)';
  } catch (e) {
    $('status').textContent = 'export failed: ' + String(e.message || e);
  } finally {
    buttons.forEach(b => b.disabled = false);
  }
}
$('expNdjson').onclick = () => exportLogs('ndjson');
$('expCsv').onclick = () => exportLogs('csv');

// Top values of one field among the current results (a field chosen from what the results carry).
const TOP_BUILTIN = ['host', 'app', 'severity'];
let topReq = 0;
try { $('top').open = localStorage.getItem('logpit-top-open') === '1'; } catch {}
$('top').addEventListener('toggle', () => {
  try { localStorage.setItem('logpit-top-open', $('top').open ? '1' : '0'); } catch {}
  loadTop();
});
$('topField').onchange = () => {
  try { localStorage.setItem('logpit-top-field', $('topField').value); } catch {}
  loadTop();
};

// The filters of the last search, without the one on the dimension being listed, so that its
// alternatives stay visible after you have filtered on one of them.
function topParams(field) {
  const p = chartParams();
  if (field === 'host') p.delete('host');
  if (field === 'app') p.delete('app');
  const f = p.get('f');
  if (f && f.match(/^[^:=!<>~]*/)[0] === field) p.delete('f');
  return p;
}

function filterOnTop(field, value) {
  if (field === 'host') $('host').value = value;
  else if (field === 'app') $('app').value = value;
  else if (field === 'severity') {
    const level = String(LEVELS.indexOf(value));
    if (![...$('level').options].some(o => o.value === level)) return; // only err, warn and info are offered
    $('level').value = level;
  } else $('f').value = field + ':' + value;
  load();
}

async function loadTop() {
  if (!snap || !$('top').open) return;
  const req = ++topReq;
  try {
    const fp = chartParams();
    fp.set('limit', '100');
    const fr = await fetch('/api/fields?' + fp, { headers: authHeaders() });
    if (!fr.ok || req !== topReq) return;
    const names = (await fr.json()).map(f => f.key).filter(k => !TOP_BUILTIN.includes(k));
    const sel = $('topField');
    let wanted = sel.value;
    try { wanted = wanted || localStorage.getItem('logpit-top-field') || ''; } catch {}
    const options = [...TOP_BUILTIN, ...names];
    if (!options.includes(wanted)) wanted = names[0] || 'host';
    sel.replaceChildren(...options.map(k => {
      const o = document.createElement('option');
      o.value = k; o.textContent = k + (TOP_BUILTIN.includes(k) ? '' : ' (field)');
      return o;
    }));
    sel.value = wanted;

    const p = topParams(wanted);
    p.set('field', wanted);
    p.set('limit', '10');
    const res = await fetch('/api/top?' + p, { headers: authHeaders() });
    if (!res.ok || req !== topReq) return;
    const d = await res.json();
    const max = Math.max(1, ...d.values.map(v => v.count));
    $('topMeta').textContent = '(' + wanted + ')';
    $('topNote').textContent = d.with_field.toLocaleString() + ' of ' + d.matching.toLocaleString() + ' entries have it · ' + d.distinct.toLocaleString() + ' distinct values';
    $('topList').replaceChildren(...d.values.map(v => {
      const row = document.createElement('div');
      row.className = 'toprow';
      const val = document.createElement('span');
      val.className = 'v'; val.textContent = v.value; val.title = 'Filter on ' + wanted + ' = ' + v.value;
      val.onclick = () => filterOnTop(wanted, v.value);
      const bar = document.createElement('div');
      bar.className = 'bar'; bar.style.width = (100 * v.count / max) + '%';
      const n = document.createElement('span');
      n.className = 'n';
      const b = document.createElement('b'); b.textContent = v.count.toLocaleString();
      n.append(b, document.createTextNode(' · ' + (100 * v.count / Math.max(1, d.with_field)).toFixed(1) + '%'));
      row.append(val, bar, n);
      return row;
    }));
    if (d.other > 0) {
      const more = document.createElement('div');
      more.className = 'toprow';
      const t = document.createElement('span'); t.className = 'v'; t.style.cursor = 'default'; t.style.color = 'var(--muted)';
      t.textContent = 'other (' + (d.distinct - d.values.length).toLocaleString() + ' values)';
      const n = document.createElement('span'); n.className = 'n'; n.style.gridColumn = '3'; n.textContent = d.other.toLocaleString();
      more.append(t, document.createElement('span'), n);
      $('topList').append(more);
    }
  } catch {}
}

// Message patterns of the current results: messages that differ only by numbers are counted together.
// The trend compares the second half of the window with the first one.
let patReq = 0;
try { $('patterns').open = localStorage.getItem('logpit-patterns-open') === '1'; } catch {}
$('patterns').addEventListener('toggle', () => {
  try { localStorage.setItem('logpit-patterns-open', $('patterns').open ? '1' : '0'); } catch {}
  loadPatterns();
});
function trendOf(prev, recent) {
  if (prev === 0) return recent > 0 ? { cls: 'up', text: '▲ new' } : { cls: 'flat', text: '' };
  const pct = Math.round(100 * (recent - prev) / prev);
  if (Math.abs(recent - prev) < 3 || Math.abs(pct) < 25) return { cls: 'flat', text: '≈ ' + (pct > 0 ? '+' : '') + pct + '%' };
  return pct > 0 ? { cls: 'up', text: '▲ +' + pct + '%' } : { cls: 'down', text: '▼ ' + pct + '%' };
}
async function loadPatterns() {
  if (!snap || !$('patterns').open) return;
  const req = ++patReq;
  try {
    const p = chartParams();
    p.set('limit', '25');
    const res = await fetch('/api/patterns?' + p, { headers: authHeaders() });
    if (!res.ok || req !== patReq) return;
    const d = await res.json();
    $('patMeta').textContent = '(' + d.distinct.toLocaleString() + ')';
    $('patNote').textContent = d.scanned.toLocaleString() + ' entries analysed' + (d.truncated ? ' (the newest ones only)' : '') +
      ' · trend: ' + new Date(d.since + (d.until - d.since) / 2).toLocaleTimeString() + ' → ' + new Date(d.until).toLocaleTimeString() +
      ' against the half before';
    const rows = d.patterns.map(x => {
      const row = document.createElement('div');
      row.className = 'patrow';
      const n = document.createElement('span'); n.className = 'n'; n.textContent = x.count.toLocaleString();
      const tr = trendOf(x.previous, x.recent);
      const t = document.createElement('span'); t.className = 't ' + tr.cls; t.textContent = tr.text;
      const pat = document.createElement('span');
      pat.className = 'p' + (x.search ? ' link' : '');
      pat.textContent = x.pattern || '(empty)';
      pat.title = x.example.message.slice(0, 300) + (x.search ? '\n\nClick to search: ' + x.search : '');
      if (x.search) pat.onclick = () => { $('q').value = x.search; load(); };
      const m = document.createElement('span'); m.className = 'm';
      m.textContent = x.severity + ' · ' + x.hosts + (x.hosts >= 100 ? '+' : '') + ' host' + (x.hosts === 1 ? '' : 's') + ' · ' + ago(x.last_ts);
      row.append(n, t, pat, m);
      return row;
    });
    if (d.other > 0) {
      const row = document.createElement('div'); row.className = 'patrow';
      const n = document.createElement('span'); n.className = 'n'; n.textContent = d.other.toLocaleString();
      const t = document.createElement('span');
      const pat = document.createElement('span'); pat.className = 'p'; pat.style.color = 'var(--muted)';
      pat.textContent = 'other (' + (d.distinct - d.patterns.length).toLocaleString() + ' patterns)';
      row.append(n, t, pat);
      rows.push(row);
    }
    $('patList').replaceChildren(...rows);
  } catch {}
}

// Per-host summary of the current filters (all hosts, even when one is selected).
function ago(ms) {
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

// Column sorting is done by the server (`sort`/`order`), so the 200-host cap applies after
// sorting. Text sorts ascending first, numbers and dates descending first; clicking again reverses.
let hostRows = [];
let hostSort = { key: 'count', dir: -1 };
try {
  const [k, d] = (localStorage.getItem('logpit-hosts-sort') || '').split(':');
  if (['host', 'count', 'errors', 'warnings', 'last_ts'].includes(k) && (d === '1' || d === '-1')) hostSort = { key: k, dir: Number(d) };
} catch {}

function sortBy(key) {
  hostSort = hostSort.key === key ? { key, dir: -hostSort.dir } : { key, dir: key === 'host' ? 1 : -1 };
  try { localStorage.setItem('logpit-hosts-sort', hostSort.key + ':' + hostSort.dir); } catch {}
  markSort();
  loadHosts();
}

for (const th of document.querySelectorAll('#hostsTable th[data-sort]')) {
  th.tabIndex = 0;
  th.title = 'Sort by ' + th.textContent.toLowerCase();
  th.onclick = () => sortBy(th.dataset.sort);
  th.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sortBy(th.dataset.sort); } };
}

function markSort() {
  for (const th of document.querySelectorAll('#hostsTable th[data-sort]')) {
    if (th.dataset.sort === hostSort.key) th.setAttribute('aria-sort', hostSort.dir === 1 ? 'ascending' : 'descending');
    else th.removeAttribute('aria-sort');
  }
}

function renderHosts() {
  markSort();
  $('hostsCount').textContent = '(' + hostRows.length + ')';
  $('hostsBody').replaceChildren(...hostRows.map(h => {
    const tr = document.createElement('tr');
    if (snap && h.host === snap.host) tr.className = 'active';
    const name = td('name', h.host);
    name.title = 'Filter on host ' + h.host;
    name.onclick = () => { $('host').value = h.host; load(); };
    if (h.silent) {
      const b = document.createElement('span');
      b.className = 'badge';
      b.textContent = 'silent';
      b.title = 'No logs received within the silence threshold';
      name.append(b);
    }
    const num = (v, cls) => td('n' + (v ? (cls ? ' ' + cls : '') : ' zero'), v.toLocaleString());
    const seen = td('', ago(h.last_ts));
    seen.title = new Date(h.last_ts).toLocaleString();
    const tagCell = td('', '');
    for (const t of h.tags || []) {
      const b = document.createElement('span');
      b.className = 'badge';
      b.textContent = t;
      b.style.cursor = 'pointer';
      b.title = 'Filter on tag ' + t;
      b.onclick = () => { $('tag').value = t; load(); };
      tagCell.append(b, ' ');
    }
    tr.append(name, tagCell, num(h.count), num(h.errors, 's3'), num(h.warnings, 's4'), seen);
    return tr;
  }));
}

let hostsReq = 0;
async function loadHosts() {
  if (!snap || !$('hosts').open) return;
  const req = ++hostsReq;
  const p = chartParams();
  p.delete('host');
  p.set('limit', '200');
  p.set('sort', hostSort.key);
  p.set('order', hostSort.dir === 1 ? 'asc' : 'desc');
  try {
    const res = await fetch('/api/hosts?' + p, { headers: authHeaders() });
    if (!res.ok) return;
    const rows = await res.json();
    if (req !== hostsReq) return; // a newer request (e.g. another sort click) superseded this one
    hostRows = rows;
    renderHosts();
  } catch {}
}
markSort();
try { $('hosts').open = localStorage.getItem('logpit-hosts-open') === '1'; } catch {}
$('hosts').addEventListener('toggle', () => {
  try { localStorage.setItem('logpit-hosts-open', $('hosts').open ? '1' : '0'); } catch {}
  loadHosts();
});

// The last search is mirrored in the URL (never the token), so a link restores the same view:
// filters, time range or zoomed window, and the chart grouping. Each new search is a history
// entry, so Back undoes it (including a zoom).
const DEFAULT_RANGE = '3600000';
let suppressPush = false; // set while restoring from the URL, so that does not add history entries
function snapQuery() {
  const p = new URLSearchParams();
  for (const k of SNAP_KEYS) if (snap[k]) p.set(k, snap[k]);
  if (snap.range === 'custom') { p.set('since', String(snap.since)); p.set('until', String(snap.until)); }
  else if (snap.range === '') p.set('range', 'all');
  else if (snap.range !== DEFAULT_RANGE) p.set('range', snap.range);
  if ($('group').value !== 'severity') p.set('group', $('group').value);
  return p.toString();
}
function syncUrl(forceReplace) {
  const qs = snapQuery(), cur = location.search.replace(/^\?/, '');
  const url = qs ? '?' + qs : location.pathname;
  if (suppressPush || forceReplace) { suppressPush = false; history.replaceState(null, '', url); }
  else if (qs !== cur) history.pushState(null, '', url);
}
function applyUrl() {
  const p = new URLSearchParams(location.search);
  // The tag list arrives asynchronously, so a tag from the address must still be selectable.
  const wantedTag = p.get('tag') || '';
  if (wantedTag && ![...$('tag').options].some(o => o.value === wantedTag)) {
    const o = document.createElement('option');
    o.value = o.textContent = wantedTag;
    $('tag').append(o);
  }
  for (const k of SNAP_KEYS) $(k).value = p.get(k) || '';
  const since = Number(p.get('since')), until = Number(p.get('until'));
  if (p.has('since') && p.has('until') && Number.isFinite(since) && Number.isFinite(until) && since <= until) {
    setZoomWindow(since, until);
  } else {
    leaveZoom();
    const r = p.get('range');
    $('range').value = r === 'all' ? '' : [...$('range').options].some(o => o.value === r) ? r : DEFAULT_RANGE;
  }
  const g = p.get('group');
  if (['severity', 'host', 'app'].includes(g)) $('group').value = g;
}
window.addEventListener('popstate', () => { applyUrl(); suppressPush = true; load(); });

// Saved views: a named search kept on the server (the same query string the address bar holds),
// so a team shares its useful searches. Selecting one opens it; saving under an existing name
// replaces that view.
let savedViews = [];
function currentQuery() { return snap ? snapQuery() : location.search.replace(/^\?/, ''); }

// Two queries mean the same search when they agree after dropping empty values and the default
// range and ordering the keys (a saved view may list its parameters in any order).
function canonQuery(q) {
  const p = new URLSearchParams(q);
  if (p.get('range') === DEFAULT_RANGE) p.delete('range');
  for (const [k, v] of [...p]) if (v === '') p.delete(k);
  p.sort();
  return p.toString();
}

function markCurrentView() {
  const q = canonQuery(currentQuery());
  const match = savedViews.find(v => canonQuery(v.query) === q);
  $('views').value = match ? String(match.id) : '';
  $('delView').hidden = !match;
}

async function loadViews() {
  try {
    const res = await fetch('/api/views', { headers: authHeaders() });
    if (!res.ok) { $('views').hidden = $('saveView').hidden = true; return; }
    savedViews = await res.json();
    $('views').hidden = $('saveView').hidden = false;
    const placeholder = document.createElement('option');
    placeholder.value = ''; placeholder.textContent = savedViews.length ? 'Views' : 'No saved views';
    $('views').replaceChildren(placeholder, ...savedViews.map(v => {
      const o = document.createElement('option');
      o.value = String(v.id); o.textContent = v.name;
      return o;
    }));
    markCurrentView();
  } catch { $('views').hidden = $('saveView').hidden = true; }
}

$('views').onchange = () => {
  const v = savedViews.find(x => String(x.id) === $('views').value);
  if (!v) return;
  history.pushState(null, '', v.query ? '?' + v.query : location.pathname);
  applyUrl();
  load();
};

$('saveView').onclick = async () => {
  const match = savedViews.find(v => String(v.id) === $('views').value);
  const name = prompt('Name for this view (an existing name is replaced):', match ? match.name : '');
  if (name === null || !name.trim()) return;
  try {
    const res = await fetch('/api/views', {
      method: 'POST',
      headers: { ...authHeaders(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, query: currentQuery() }),
    });
    if (!res.ok) throw new Error((await res.text()).slice(0, 160) || 'HTTP ' + res.status);
    const saved = await res.json();
    await loadViews();
    $('views').value = String(saved.id);
    $('delView').hidden = false;
    $('status').textContent = 'view "' + saved.name + '" saved';
  } catch (e) { $('status').textContent = 'could not save the view: ' + String(e.message || e); }
};

$('delView').onclick = async () => {
  const v = savedViews.find(x => String(x.id) === $('views').value);
  if (!v || !confirm('Delete the view "' + v.name + '"?')) return;
  try {
    const res = await fetch('/api/views/' + v.id, { method: 'DELETE', headers: authHeaders() });
    if (!res.ok && res.status !== 404) throw new Error((await res.text()).slice(0, 160) || 'HTTP ' + res.status);
    await loadViews();
    $('status').textContent = 'view "' + v.name + '" deleted';
  } catch (e) { $('status').textContent = 'could not delete the view: ' + String(e.message || e); }
};


$('group').onchange = () => {
  try { localStorage.setItem('logpit-group', $('group').value); } catch {}
  if (snap) syncUrl(true);
  loadChart();
};

// Paging: the server returns `X-Next-Cursor` when a page is full; "Load more" appends the next one.
let nextCursor = null, pageParams = null;
const PAGE_SIZE = 500;

async function loadMore() {
  if (!nextCursor || !pageParams) return;
  const p = new URLSearchParams(pageParams);
  p.set('before', nextCursor);
  $('more').disabled = true;
  try {
    const res = await fetch('/api/logs?' + p, { headers: authHeaders() });
    if (!res.ok) throw new Error((await res.text()).slice(0, 120) || 'HTTP ' + res.status);
    const rows = await res.json();
    $('rows').append(...rows.map(rowEl));
    nextCursor = res.headers.get('X-Next-Cursor');
    $('morebar').hidden = !nextCursor;
    $('status').textContent = entryCount() + ' entries' + (nextCursor ? ' (more available)' : '');
  } catch (e) { $('status').textContent = String(e.message || e); }
  finally { $('more').disabled = false; }
}
$('more').onclick = loadMore;

async function load() {
  stopTail();
  takeSnapshot();
  nextCursor = null;
  $('morebar').hidden = true;
  if (snap.range === 'custom') $('live').checked = false;
  syncUrl();
  const p = new URLSearchParams({ limit: String(PAGE_SIZE) });
  for (const k of SNAP_KEYS) if ($(k).value.trim()) p.set(k, $(k).value.trim());
  applyWindow(p, snap);
  const headers = authHeaders();
  const token = $('token').value;
  if (token) { try { localStorage.setItem('logpit-token', token); } catch {} }
  try {
    const res = await fetch('/api/logs?' + p, { headers });
    if (res.status === 401) {
      $('rows').replaceChildren();
      $('empty').textContent = token ? 'Invalid token. Check the Token field above.' : 'This LogPit requires a token. Enter it in the Token field above, then press Search.';
      $('empty').hidden = false;
      $('status').textContent = 'unauthorized';
      $('token').focus();
      return;
    }
    if (res.status === 403) {
      $('rows').replaceChildren();
      $('empty').textContent = 'This token is not allowed to read logs (it has no read scope). Enter a token with read access.';
      $('empty').hidden = false;
      $('status').textContent = 'forbidden';
      $('token').focus();
      return;
    }
    if (!res.ok) throw new Error((await res.text()).slice(0, 120) || 'HTTP ' + res.status);
    const rows = await res.json();
    const body = $('rows');
    body.replaceChildren(...rows.map(rowEl));
    $('empty').textContent = 'No matching entries.';
    $('empty').hidden = rows.length > 0;
    pageParams = p.toString();
    nextCursor = res.headers.get('X-Next-Cursor');
    $('morebar').hidden = !nextCursor;
    $('status').textContent = rows.length + ' entries' + (nextCursor ? ' (more available)' : '');
    loadChart();
    loadHosts();
    loadTop();
    loadPatterns();
    loadViews();
    if ($('live').checked) startTail();
  } catch (e) { $('status').textContent = String(e.message || e); }
}

$('go').onclick = load;
$('token').addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
for (const id of ['q', 'host', 'app', 'f', 're']) $(id).addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
$('level').onchange = load;
$('tag').onchange = load;
// Host tags from the configuration: the selector only appears when some are defined.
async function loadTagOptions() {
  try {
    const res = await fetch('/api/tags', { headers: authHeaders() });
    if (!res.ok) return;
    const names = (await res.json()).map(t => t.name);
    const current = $('tag').value;
    const first = $('tag').options[0];
    $('tag').replaceChildren(first, ...names.map(n => {
      const o = document.createElement('option');
      o.value = o.textContent = n;
      return o;
    }));
    if (current && !names.includes(current)) {
      const o = document.createElement('option');
      o.value = o.textContent = current;
      $('tag').append(o);
    }
    $('tag').value = current;
    $('tag').hidden = names.length === 0 && !current;
  } catch {}
}
$('range').onchange = () => { if ($('range').value !== 'custom') leaveZoom(); load(); };
$('live').onchange = () => { if ($('live').checked) load(); else { stopTail(); load(); } };
applyUrl();
loadTagOptions();
suppressPush = true; // the first load canonicalizes the URL instead of adding an entry
load();
</script>
</body>
</html>
