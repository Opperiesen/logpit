[package]
name = "logpit"
version = "0.13.0"
edition = "2024"
description = "A lightweight, self-contained log aggregator (syslog, journald, SQLite/FTS5)"
license = "Apache-2.0"
readme = "README.md"
keywords = ["logs", "syslog", "journald", "observability"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["http2"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
futures-util = "0.3.34"
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode"] }
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "signal", "time", "io-util", "sync", "process", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-roots = "1.0.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
h2 = "0.4.19"
http = "1"
rcgen = "0.14.10"
