# Container defaults (baked into the image at /etc/logpit/logpit.toml).
# Prefer LOGPIT_* environment variables to override them; mount your own file
# over this path only if you need more than the variables offer.
#
# Syslog listens on 5514 because the image runs as a non-root user, which cannot
# bind port 514. Map it at publish time: -p 514:5514/udp -p 514:5514/tcp
[storage]
path = "/data/logpit.db"

[syslog]
udp_listen = "0.0.0.0:5514"
tcp_listen = "0.0.0.0:5514"

[http]
listen = "0.0.0.0:8080"
